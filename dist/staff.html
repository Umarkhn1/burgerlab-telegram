<style>:root {
  --bg: #FFFFFF;
  --ink: #000000;
  --ink-2: #4A4642;
  --ink-3: #8C857E;
  --line: #ECE6DF;
  --soft: #F6F2ED;
  --beige: #F3E8DA;
  --beige-2: #FBF6EF;
  --orange: #FF5A00;
  --orange-2: #E24F00;
  --orange-soft: #FFF0E6;
  --green: #17A058;
  --card: #FFFFFF;
  --shadow: 0 12px 32px -18px rgba(60, 30, 0, .35);
  --shadow-2: 0 2px 0 rgba(0, 0, 0, .04), 0 18px 40px -22px rgba(60, 30, 0, .45);
  --display: 'Unbounded', 'Arial Black', 'Helvetica Neue', Arial, sans-serif;
  --body: 'Onest', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --tab-h: 64px;
  --nav-gap: 10px;
  --ease-out: cubic-bezier(.22, .9, .3, 1);
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F0F0F; --ink: #FFFFFF; --ink-2: #CFC8C0; --ink-3: #8F877F; --line: #2A2724; --soft: #1C1A18;
    --beige: #2A231C; --beige-2: #1A1612; --orange-soft: #2E1A0E; --card: #171615;
    --shadow: 0 12px 32px -18px rgba(0, 0, 0, .8); --shadow-2: 0 18px 40px -22px rgba(0, 0, 0, .9);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F0F0F; --ink: #FFFFFF; --ink-2: #CFC8C0; --ink-3: #8F877F; --line: #2A2724; --soft: #1C1A18;
  --beige: #2A231C; --beige-2: #1A1612; --orange-soft: #2E1A0E; --card: #171615;
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; background: var(--bg); }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overflow: hidden; }
#root { height: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:disabled { cursor: not-allowed; }
input, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; }
p { margin: 0; }
:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; border-radius: 10px; }
img, svg { max-width: 100%; }

/* ---------- Shell ---------- */
.app { height: 100%; display: flex; }
.app.is-mob { flex-direction: column; }
.main { flex: 1; min-height: 0; min-width: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
/* под плавающую навигацию оставляем место, чтобы она не закрывала низ экрана */
.is-mob > .main { padding-bottom: calc(var(--tab-h) + var(--nav-gap) * 2); }
.is-mob.r-kitchen > .main { padding-bottom: 0; }
.r-builder > .main, .r-panel > .main { overflow: hidden; }
.r-builder .screen, .r-panel .screen { height: 100%; }
/* Переход между разделами. Без fill-mode: после анимации у экрана нет transform,
   иначе position: fixed (шторки) внутри считались бы от него */
.screen { animation: screenIn .32s var(--ease-out); }
@keyframes screenIn { from { opacity: 0; transform: translateY(10px); } }
.r-kitchen .main { background: #0B0B0B; }

.mob-top { display: flex; align-items: center; justify-content: space-between; padding: 10px 18px 4px; flex: none; }
.logo { display: inline-flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: -.02em; }
.logo b { color: var(--orange); font-weight: 700; }

/* Плавающая навигация: скруглённая «пилюля» и индикатор, который переезжает к активному разделу */
.tabbar {
  position: fixed; left: 12px; right: 12px; bottom: calc(var(--nav-gap) + env(safe-area-inset-bottom, 0px)); z-index: 100;
  max-width: 520px; margin: 0 auto; height: var(--tab-h); padding: 6px;
  display: grid; grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr));
  background: var(--card); border: 1px solid var(--line); border-radius: 26px;
  box-shadow: 0 14px 34px -14px rgba(40, 20, 0, .38), 0 2px 8px -4px rgba(40, 20, 0, .18);
  transition: transform .38s var(--ease-out), opacity .25s;
  animation: navIn .55s cubic-bezier(.3, 1.3, .5, 1);
}
.tabbar.hide { transform: translateY(calc(100% + 24px)); opacity: 0; pointer-events: none; }
@keyframes navIn { from { transform: translateY(calc(100% + 24px)); opacity: 0; } }
.tab-ind {
  position: absolute; top: 6px; bottom: 6px; left: 6px; width: calc((100% - 12px) / var(--n, 5));
  border-radius: 20px; background: var(--ink);
  transform: translateX(calc(var(--i, 0) * 100%)); transition: transform .45s cubic-bezier(.34, 1.25, .5, 1), opacity .2s;
  will-change: transform;
}
.tab-ind.off { opacity: 0; }
.tab { position: relative; z-index: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; border-radius: 20px; color: var(--ink-3); font-size: 10.5px; font-weight: 650; transition: color .3s; }
.tab.on { color: var(--bg); }
.tab-t { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab-ico { position: relative; display: grid; place-items: center; width: 40px; height: 28px; transition: transform .2s var(--ease-out); }
.tab:active .tab-ico { transform: scale(.86); }
.tab.on .tab-ico { transform: translateY(-1px); }
.tab-build:not(.on) { color: var(--orange-2); }
.count { position: absolute; top: -4px; right: -2px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--orange); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; animation: pop .35s ease; }
.side-link .count { position: static; margin-left: auto; }
@keyframes pop { 0% { transform: scale(.4); } 70% { transform: scale(1.2); } 100% { transform: scale(1); } }

.sidebar { width: 236px; flex: none; border-right: 1px solid var(--line); padding: 20px 14px; display: flex; flex-direction: column; gap: 18px; overflow-y: auto; }
.side-logo { padding: 6px 10px; align-self: flex-start; }
.side-links, .side-demo { display: flex; flex-direction: column; gap: 2px; }
.side-link { display: flex; align-items: center; gap: 10px; text-align: left; padding: 11px 14px; border-radius: 14px; font-weight: 600; color: var(--ink-2); transition: background .15s, color .15s; }
.side-link:hover { background: var(--soft); color: var(--ink); }
.side-link.on { background: var(--ink); color: var(--bg); }
.side-demo { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--line); }
.side-cap { font-size: 12px; color: var(--ink-3); padding: 0 14px 6px; }
.side-order { margin-top: 8px; padding: 10px 14px; border-radius: 14px; background: var(--orange-soft); color: var(--orange-2); font-weight: 700; text-align: left; font-size: 13px; }
.side-order.sm { margin: 0; padding: 6px 12px; border-radius: 999px; }

/* ---------- Buttons & controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 22px; border-radius: 999px; font-weight: 650; font-size: 15px; white-space: nowrap; transition: transform .12s ease, background .2s, box-shadow .2s, color .2s; user-select: none; }
.btn:active:not(:disabled) { transform: scale(.96); }
.btn:disabled { opacity: .4; }
.btn.primary { background: var(--orange); color: #fff; box-shadow: 0 10px 22px -12px rgba(255, 90, 0, .9); }
.btn.primary:hover:not(:disabled) { background: var(--orange-2); }
.btn.dark { background: var(--ink); color: var(--bg); }
.btn.outline { border: 1.5px solid var(--ink); }
.btn.outline:hover { background: var(--ink); color: var(--bg); }
.btn.ghost { background: var(--soft); }
.btn.ghost:hover { background: var(--beige); }
.btn.ghost.muted { color: var(--ink-3); }
.btn.lg { height: 56px; font-size: 16px; padding: 0 28px; }
.btn.sm { height: 38px; font-size: 13px; padding: 0 14px; }
.btn.block { width: 100%; }
.link { color: var(--orange-2); font-weight: 650; }
.link.sm { font-size: 13px; }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 999px; color: var(--ink-2); transition: background .15s, color .15s; flex: none; }
.icon-btn:hover { background: var(--soft); color: var(--ink); }
.icon-btn.sm { width: 34px; height: 34px; }
.icon-btn.back { font-size: 20px; background: var(--soft); }

.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; }
.chip { flex: none; height: 40px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--line); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; transition: background .15s, border-color .15s, color .15s, transform .1s; background: var(--bg); }
.chip:active { transform: scale(.95); }
.chip:hover { border-color: var(--ink-3); }
.chip.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.cat-ico { font-size: 16px; }
.cat-n { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--orange); color: #fff; font-size: 11px; display: grid; place-items: center; }

.seg { display: flex; background: var(--soft); border-radius: 999px; padding: 4px; gap: 4px; }
.seg button { flex: 1; height: 40px; border-radius: 999px; font-weight: 650; font-size: 14px; color: var(--ink-2); transition: background .2s, color .2s, box-shadow .2s; }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 2px 10px -4px rgba(0, 0, 0, .25); }
.seg.big button { height: 48px; }

.stepper { display: grid; grid-template-columns: 38px 1fr 38px; align-items: center; height: 42px; border-radius: 999px; background: var(--soft); padding: 2px; }
.stepper button { width: 38px; height: 38px; border-radius: 999px; font-size: 20px; font-weight: 600; display: grid; place-items: center; transition: transform .1s, background .15s; line-height: 1; }
.stepper button:active:not(:disabled) { transform: scale(.85); }
.stepper button:first-child { background: var(--card); }
.stepper button:last-child { background: var(--ink); color: var(--bg); }
.stepper.on button:last-child { background: var(--orange); color: #fff; }
.stepper .qty { text-align: center; font-family: var(--display); font-weight: 700; font-size: 15px; }
.stepper button:disabled { opacity: .35; }

.pill { font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 999px; background: var(--soft); color: var(--ink-2); }
.pill-on { background: var(--orange); color: #fff; }
.hint { font-size: 13px; color: var(--ink-3); margin: 10px 2px; }
.muted-t { color: var(--ink-3); font-size: 13px; }
.fine { font-size: 12px; color: var(--ink-3); margin-top: 10px; }

.type-badge { display: inline-flex; align-items: center; height: 28px; padding: 0 12px; border-radius: 999px; font-family: var(--display); font-size: 11px; font-weight: 700; letter-spacing: .01em; border: 1.5px solid var(--ink); background: var(--bg); white-space: nowrap; transition: background .3s, color .3s; }
.type-badge.tone-warm { background: var(--beige); border-color: var(--beige); color: #7A4A12; }
.type-badge.tone-hot { background: var(--orange); border-color: var(--orange); color: #fff; }
.type-badge.tone-fire { background: #000; border-color: #000; color: var(--orange); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(255, 90, 0, .25); } }

/* ---------- Burger stack ---------- */
.stack-wrap { position: relative; width: 100%; display: flex; align-items: flex-end; justify-content: center; }
.stack { width: 300px; flex: none; transform-origin: 50% 100%; transition: transform .5s cubic-bezier(.25, .8, .3, 1); position: relative; }
.layer { position: relative; width: 300px; }
.layer.drop { animation: drop .62s cubic-bezier(.3, .7, .35, 1) both; }
@keyframes drop {
  0% { transform: translateY(-240px) rotate(-3deg); opacity: 0; }
  45% { opacity: 1; }
  62% { transform: translateY(7px) scaleY(.92); }
  80% { transform: translateY(-5px) scaleY(1.02); }
  100% { transform: none; }
}
.plate-shadow { position: absolute; left: 20px; right: 20px; bottom: 12px; height: 22px; border-radius: 50%; background: radial-gradient(closest-side, rgba(60, 30, 0, .28), transparent); z-index: 0; }
.stack-empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-3); font-weight: 600; }
.ruler { position: absolute; left: 50%; width: 10px; border-left: 2px solid var(--ink); transition: height .5s cubic-bezier(.25, .8, .3, 1), transform .5s cubic-bezier(.25, .8, .3, 1), bottom .5s; background: repeating-linear-gradient(to top, var(--ink) 0 1.5px, transparent 1.5px 10px) left / 6px 100% no-repeat; opacity: .75; }
.ruler::before, .ruler::after { content: ''; position: absolute; left: -2px; width: 12px; height: 2px; background: var(--ink); }
.ruler::before { top: 0; } .ruler::after { bottom: 0; }
.ruler-label { position: absolute; top: -30px; left: -8px; background: var(--ink); color: var(--bg); font-family: var(--display); font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 999px; white-space: nowrap; }

/* ---------- Builder ---------- */
.stage-card { background: radial-gradient(120% 90% at 50% 100%, var(--beige) 0%, var(--beige-2) 55%, var(--bg) 100%); }
.stage-top { padding: 10px 16px 0; }
.size-chips .chip { height: 34px; font-size: 13px; padding: 0 14px; font-family: var(--display); font-weight: 600; }
.stage { position: relative; overflow: hidden; height: clamp(180px, 31vh, 300px); padding-top: 26px; }
.stage-badges { position: absolute; top: 10px; right: 14px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; z-index: 50; }
.editing { font-size: 12px; font-weight: 700; background: var(--card); padding: 4px 10px; border-radius: 999px; box-shadow: var(--shadow); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stats-row { display: grid; grid-template-columns: repeat(4, auto); justify-content: space-between; gap: 8px; padding: 8px 16px 12px; }
.stat { display: flex; flex-direction: column; min-width: 0; }
.stat-v { font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: -.02em; white-space: nowrap; font-variant-numeric: tabular-nums; }
.stat-v small { font-size: 10px; font-weight: 600; }
.stat.main .stat-v { color: var(--orange); font-size: 17px; }
.stat-l { font-size: 11px; color: var(--ink-3); font-weight: 600; }

.builder.mob { height: 100%; display: flex; flex-direction: column; overflow: hidden; }
.builder.mob .stage-card { flex: none; }
/* Компактная сцена: раскладка не меняется, двигаются только слои композиции (transform на GPU).
   Панель заранее выше на --shift и уходит под нижнюю плашку, при прокрутке она поднимается,
   цифры едут вместе с ней, а бургер уменьшается от верхнего края. */
.builder.mob .stack-zoom { transform-origin: 50% 0; transition: transform .42s var(--ease-out); will-change: transform; }
.builder.mob.is-compact .stack-zoom { transform: scale(var(--zoom, .6)); }
.builder.mob .stats-row { padding-bottom: 20px; position: relative; transition: transform .42s var(--ease-out); will-change: transform; }
.builder.mob.is-compact .stats-row { transform: translateY(calc(-1 * var(--shift, 0px))); }
.b-panel { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px 18px; background: var(--bg); border-radius: 24px 24px 0 0; margin-top: -14px; position: relative; z-index: 60; box-shadow: 0 -10px 24px -18px rgba(60, 30, 0, .4); overscroll-behavior: contain; }
.builder.mob .b-panel { margin-bottom: calc(-1 * var(--shift, 0px)); padding-bottom: calc(18px + var(--shift, 0px)); transition: transform .42s var(--ease-out); will-change: transform; }
.builder.mob.is-compact .b-panel { transform: translateY(calc(-1 * var(--shift, 0px))); }
.b-panel .seg { margin-bottom: 12px; }
.cat-chips { margin: 0 -16px; padding: 2px 16px; }
.ing-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
.ing-card { background: var(--card); border: 1.5px solid var(--line); border-radius: 20px; padding: 8px; display: flex; flex-direction: column; gap: 8px; transition: border-color .2s, background .2s, transform .15s; }
.ing-card.has { border-color: var(--orange); background: linear-gradient(var(--orange-soft), var(--card) 60%); }
.ing-card.out { opacity: .5; }
.ing-hit { display: flex; flex-direction: column; align-items: stretch; text-align: left; gap: 2px; border-radius: 14px; }
.ing-hit:active:not(:disabled) .ing-thumb { transform: scale(.94); }
.ing-thumb { height: 64px; border-radius: 14px; background: var(--beige-2); display: grid; place-items: center; padding: 4px 8px; margin-bottom: 6px; transition: transform .15s; overflow: hidden; }
.ing-name { font-weight: 650; font-size: 14px; line-height: 1.2; }
.ing-meta { font-size: 11.5px; color: var(--ink-3); }
.ing-price { font-family: var(--display); font-weight: 600; font-size: 13px; margin-top: 2px; }
.ing-out { text-align: center; font-size: 13px; font-weight: 700; color: var(--ink-3); padding: 10px 0; }
.bun-row { display: flex; flex-direction: column; gap: 6px; }
.bun-row .pill { text-align: center; }

.layer-list { list-style: none; margin: 0; padding: 0; position: relative; }
.layer-row { height: calc(var(--row) - 6px); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; padding: 0 6px 0 2px; transition: transform .2s cubic-bezier(.3, .8, .3, 1), box-shadow .2s, opacity .2s; position: relative; }
.layer-row.dragging { transition: none; z-index: 5; box-shadow: 0 16px 30px -12px rgba(0, 0, 0, .35); border-color: var(--orange); }
.layer-row.hidden { opacity: .5; }
.layer-row.hidden .layer-name { text-decoration: line-through; }
.drag-handle { width: 34px; height: 44px; display: grid; place-items: center; color: var(--ink-3); cursor: grab; touch-action: none; border-radius: 10px; }
.drag-handle:active { cursor: grabbing; color: var(--orange); }
.layer-n { width: 20px; font-family: var(--display); font-size: 11px; font-weight: 700; color: var(--ink-3); text-align: center; flex: none; }
.layer-sw { width: 40px; height: 30px; flex: none; display: grid; place-items: center; }
.layer-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.layer-name { font-weight: 650; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.layer-sub { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.b-right .layer-name { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.15; font-size: 13px; }
.b-right .layer-n { width: 16px; }
.b-right .drag-handle { width: 26px; }
.layer-actions { display: flex; flex: none; }

.ticker { display: flex; align-items: center; gap: 8px; background: var(--soft); border-radius: 12px; padding: 6px 10px; font-size: 12px; font-weight: 600; margin-bottom: 10px; line-height: 1.25; }
.ticker-t { flex: 1; min-width: 0; }
.ticker > .ms { font-size: 18px; color: var(--orange); }
.ticker-bar { flex: 0 0 56px; height: 5px; border-radius: 4px; background: var(--line); overflow: hidden; }
.ticker-bar i { display: block; height: 100%; background: var(--orange); transition: width .4s; }
.ticker.done { background: var(--orange-soft); color: var(--orange-2); }

.warnings { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.warn { border-radius: 14px; padding: 10px 12px; background: var(--beige-2); border: 1.5px solid var(--beige); display: flex; flex-direction: column; font-size: 13px; }
.warn b { font-size: 13.5px; }
.warn span { color: var(--ink-2); }
.warn.fire { background: #000; color: #fff; border-color: #000; }
.warn.fire span { color: #FFB27F; }

.action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
.action-row .btn { height: 46px; font-size: 14px; padding: 0 10px; }
.cart-bar { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--line); background: var(--bg); position: relative; z-index: 61; }
.cb-price { display: flex; flex-direction: column; min-width: 0; }
.cb-v { font-family: var(--display); font-weight: 800; font-size: 19px; letter-spacing: -.02em; white-space: nowrap; }
.cb-l { font-size: 12px; color: var(--ink-3); }
.cart-bar .btn { height: 52px; padding: 0 20px; }

.builder.desk { height: 100%; display: grid; grid-template-columns: minmax(280px, 340px) minmax(0, 1fr) minmax(330px, 400px); }
.builder.desk > * { min-height: 0; overflow-y: auto; padding: 22px; }
.b-left { border-right: 1px solid var(--line); }
.b-right { border-left: 1px solid var(--line); }
.b-center { display: flex; flex-direction: column; padding: 18px 22px !important; }
.b-center .stage-card { flex: 1; display: flex; flex-direction: column; border-radius: 28px; min-height: 480px; }
.b-center .stage { flex: 1; height: auto; min-height: 360px; }
.b-center .stats-row { padding: 12px 22px 18px; }
.b-center .stat-v { font-size: 19px; }
.b-center .stat.main .stat-v { font-size: 23px; }
.b-center .stage-top { padding: 16px 20px 0; }
.b-center .action-row { grid-template-columns: repeat(4, 1fr); }
.col-title { font-family: var(--display); font-size: 17px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 12px; }
.col-head { display: flex; align-items: baseline; justify-content: space-between; }
.b-left .cat-chips { margin: 0; padding: 2px 0; flex-wrap: wrap; }
.b-right .summary { margin-top: 16px; }

/* ---------- Generic pages ---------- */
.page { padding: 16px 16px 40px; max-width: 1180px; margin: 0 auto; }
.screen-head { display: flex; align-items: flex-start; gap: 12px; margin: 6px 0 16px; }
.sh-text { flex: 1; min-width: 0; }
.screen-head h1 { font-family: var(--display); font-weight: 800; font-size: clamp(22px, 5.4vw, 34px); letter-spacing: -.03em; line-height: 1.1; }
.screen-head p { color: var(--ink-2); margin-top: 6px; max-width: 60ch; }
.sec-title { font-family: var(--display); font-size: 17px; font-weight: 700; letter-spacing: -.02em; margin: 26px 0 12px; }
.empty { text-align: center; padding: 48px 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty-icon { font-size: 44px; width: 88px; height: 88px; border-radius: 50%; background: var(--beige-2); display: grid; place-items: center; }
.empty h3 { font-family: var(--display); font-size: 18px; }
.empty p { color: var(--ink-2); max-width: 36ch; }
.empty .btn { margin-top: 8px; }

/* ---------- Home ---------- */
.home { padding-top: 6px; }
.hero { display: grid; grid-template-columns: 1fr; gap: 6px; align-items: center; }
.brand-mark { font-weight: 700; font-size: 13px; color: var(--orange-2); margin-bottom: 12px; }
.hero h1 { font-family: var(--display); font-weight: 800; font-size: clamp(30px, 8.6vw, 64px); line-height: 1.02; letter-spacing: -.04em; text-wrap: balance; }
.lead { font-size: 16.5px; color: var(--ink-2); margin-top: 14px; max-width: 46ch; }
.hero-cta { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
.hero-cta .btn { flex: 1 1 200px; }
.hero-art { position: relative; order: -1; height: 330px; display: flex; align-items: flex-end; justify-content: center; }
.hero-disc { position: absolute; left: 50%; bottom: 0; width: min(320px, 82%); aspect-ratio: 1; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(circle at 50% 60%, var(--beige), var(--beige-2) 70%); }
.hero-art .stack-wrap { position: relative; }
.hero-tag { position: absolute; left: 6px; bottom: 26px; background: var(--card); border-radius: 18px; padding: 10px 14px; box-shadow: var(--shadow-2); display: flex; flex-direction: column; z-index: 60; }
.hero-tag b { font-family: var(--display); font-size: 15px; color: var(--orange); }
.hero-tag span { font-size: 12px; color: var(--ink-3); font-weight: 600; }

.benefits { margin-top: 30px; display: grid; grid-template-columns: 1fr; gap: 0; border-top: 1px solid var(--line); }
.benefit { display: flex; gap: 14px; align-items: flex-start; padding: 14px 2px; border-bottom: 1px solid var(--line); }
.b-ico { font-size: 22px; width: 44px; height: 44px; flex: none; border-radius: 14px; background: var(--beige-2); display: grid; place-items: center; }
.benefit h3 { font-size: 16px; font-weight: 700; }
.benefit p { color: var(--ink-2); font-size: 14px; }

.surprise { margin-top: 28px; background: #000; color: #fff; border-radius: 28px; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.surprise h2 { font-family: var(--display); font-size: 22px; letter-spacing: -.03em; }
.surprise p { color: #CFC8C0; margin-top: 6px; }

.block { margin-top: 30px; }
.block-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
.block-head h2 { font-family: var(--display); font-size: 20px; letter-spacing: -.03em; }
.h-scroll { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px; padding: 4px 16px 10px; scrollbar-width: none; }
.h-scroll::-webkit-scrollbar { display: none; }
.h-scroll > * { scroll-snap-align: start; flex: none; }

.party-teaser { margin-top: 30px; background: var(--orange); color: #fff; border-radius: 28px; padding: 24px; display: grid; gap: 10px; cursor: pointer; overflow: hidden; transition: transform .2s; }
.party-teaser:active { transform: scale(.99); }
.party-teaser h2 { font-family: var(--display); font-size: 26px; letter-spacing: -.03em; }
.party-teaser p { margin: 6px 0 16px; opacity: .92; }
.party-teaser .btn.primary { background: #000; box-shadow: none; }
.pt-art { margin: 0 -10px -6px; }

.mini-ch { width: 230px; text-align: left; border: 1.5px solid var(--line); border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 4px; background: var(--card); transition: border-color .2s; }
.mini-ch:hover { border-color: var(--orange); }
.mc-i { font-size: 28px; }
.mini-ch b { font-family: var(--display); font-size: 15px; }
.mini-ch span:last-child { color: var(--ink-2); font-size: 13.5px; }

.demo-links { margin-top: 34px; padding: 22px; border: 1.5px dashed var(--ink-3); border-radius: 24px; }
.demo-links h2 { font-family: var(--display); font-size: 18px; letter-spacing: -.02em; }
.demo-links p { color: var(--ink-2); margin: 6px 0 14px; }
.dl-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.dl-row .btn { flex: 1 1 160px; }

/* ---------- Community ---------- */
.c-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 16px; }
.c-card { background: var(--card); border: 1.5px solid var(--line); border-radius: 22px; overflow: hidden; display: flex; flex-direction: column; }
.c-card.compact { width: 210px; }
.c-art { position: relative; background: var(--beige-2); padding: 10px 6px 0; display: flex; justify-content: center; }
.c-type { position: absolute; top: 8px; left: 8px; transform: scale(.85); transform-origin: left top; }
.c-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.c-body h3 { font-family: var(--display); font-size: 14px; letter-spacing: -.02em; line-height: 1.2; }
.c-author { font-size: 12px; color: var(--ink-3); font-weight: 600; }
.c-comp { font-size: 12.5px; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.c-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; margin: auto 0 6px; padding-top: 4px; gap: 6px; }
.c-price { font-family: var(--display); font-size: 13px; white-space: nowrap; }
.like { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: var(--ink-3); padding: 6px 8px; border-radius: 999px; transition: color .15s, background .15s; }
.like.on { color: var(--orange); background: var(--orange-soft); }
.like:active svg { transform: scale(1.3); }

/* ---------- Challenges ---------- */
.ch-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
.ch-card { border: 1.5px solid var(--line); border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 8px; background: var(--card); }
.ch-card.got { border-color: var(--green); }
.ch-top { display: flex; justify-content: space-between; align-items: center; }
.ch-ico { font-size: 34px; }
.badge-got { background: var(--green); color: #fff; font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; }
.ch-card h3 { font-family: var(--display); font-size: 19px; letter-spacing: -.02em; }
.ch-card p { color: var(--ink-2); }
.bar { height: 8px; border-radius: 8px; background: var(--soft); overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; background: var(--orange); border-radius: 8px; transition: width .6s cubic-bezier(.3, .8, .3, 1); }
.ch-card.got .bar i { background: var(--green); }
.bar.big { height: 10px; margin-top: 12px; }
.ch-prog { font-size: 13px; font-weight: 600; color: var(--ink-3); margin-bottom: 6px; }

/* ---------- Saved ---------- */
.s-list { display: grid; gap: 12px; }
.s-card { display: grid; grid-template-columns: 110px 1fr; gap: 12px; border: 1.5px solid var(--line); border-radius: 22px; padding: 10px; background: var(--card); }
.s-art { background: var(--beige-2); border-radius: 16px; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
.s-body { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.s-title { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: space-between; }
.s-title h3 { font-family: var(--display); font-size: 16px; letter-spacing: -.02em; }
.s-stats { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--ink-2); }
.s-stats b { font-family: var(--display); color: var(--ink); }
.s-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

/* ---------- Party ---------- */
.party-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.party-opt { border: 1.5px solid var(--line); border-radius: 20px; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; background: var(--card); transition: border-color .2s, background .2s, transform .1s; }
.party-opt:active { transform: scale(.96); }
.party-opt b { font-family: var(--display); font-size: 26px; line-height: 1.1; }
.party-opt span { font-size: 13px; font-weight: 600; }
.party-opt small { font-size: 11px; color: var(--ink-3); margin-top: 4px; }
.party-opt.on { border-color: var(--orange); background: var(--orange-soft); }
.party-show { margin-top: 16px; border-radius: 28px; background: var(--beige-2); padding: 18px; }
.party-facts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 14px; }
.party-facts div { background: var(--card); border-radius: 16px; padding: 10px 12px; display: flex; flex-direction: column; }
.party-facts span { font-size: 12px; color: var(--ink-3); font-weight: 600; }
.party-facts b { font-family: var(--display); font-size: 15px; }
.party-cta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.party-cta .btn { flex: 1 1 220px; }
.range { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; font-weight: 600; }
.range input { accent-color: var(--orange); width: 100%; height: 32px; }

/* ---------- Profile ---------- */
.profile-card { display: flex; align-items: flex-end; gap: 14px; }
.avatar { width: 64px; height: 64px; border-radius: 22px; background: var(--orange); color: #fff; font-family: var(--display); font-size: 28px; font-weight: 800; display: grid; place-items: center; flex: none; }
.grow { flex: 1; }
.p-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
.p-stats div { background: var(--soft); border-radius: 18px; padding: 12px; display: flex; flex-direction: column; }
.p-stats b { font-family: var(--display); font-size: 22px; }
.p-stats span { font-size: 12px; color: var(--ink-3); font-weight: 600; }
.badges { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.badge { aspect-ratio: 1; border-radius: 22px; background: var(--soft); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; filter: grayscale(1); opacity: .5; text-align: center; padding: 4px; }
.badge span { font-size: 28px; }
.badge small { font-size: 10.5px; font-weight: 700; line-height: 1.1; }
.badge.on { filter: none; opacity: 1; background: var(--orange-soft); box-shadow: inset 0 0 0 2px var(--orange); }
.menu-list { display: flex; flex-direction: column; border: 1.5px solid var(--line); border-radius: 22px; overflow: hidden; }
.menu-list button { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid var(--line); text-align: left; font-weight: 600; min-height: 56px; }
.menu-list button:last-child { border-bottom: 0; }
.menu-list button:hover { background: var(--soft); }
.menu-list small { color: var(--ink-3); font-weight: 600; }
.menu-list .danger span { color: #D12D1F; }
.order-list { display: flex; flex-direction: column; gap: 8px; }
.order-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; border: 1.5px solid var(--line); border-radius: 18px; padding: 12px 14px; }
.order-row span:first-child { display: flex; flex-direction: column; min-width: 0; }
.order-row small { color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status { font-size: 12px; font-weight: 700; background: var(--orange-soft); color: var(--orange-2); padding: 5px 10px; border-radius: 999px; text-align: center; flex: none; max-width: 48%; }
.status.ok { background: #E3F6EC; color: var(--green); }

/* ---------- Forms ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: 13px; font-weight: 650; color: var(--ink-2); }
.field input, .field textarea { border: 1.5px solid var(--line); border-radius: 16px; padding: 14px 16px; background: var(--card); font-size: 16px; outline: none; transition: border-color .15s; width: 100%; }
.field input:focus, .field textarea:focus { border-color: var(--orange); }
.field.bad input { border-color: #D12D1F; }
.field em { color: #D12D1F; font-style: normal; font-size: 13px; }
.form { display: flex; flex-direction: column; gap: 16px; }
.pickup { background: var(--beige-2); border-radius: 16px; padding: 14px 16px; font-size: 14px; color: var(--ink-2); }

/* ---------- Cart ---------- */
.cart-layout { display: grid; grid-template-columns: 1fr; gap: 18px; }
.cart-main { display: flex; flex-direction: column; gap: 10px; }
.cart-item { display: grid; grid-template-columns: 96px 1fr; gap: 12px; border: 1.5px solid var(--line); border-radius: 22px; padding: 10px; background: var(--card); }
.ci-art { background: var(--beige-2); border-radius: 16px; display: flex; align-items: flex-end; justify-content: center; min-height: 96px; overflow: hidden; }
.ci-emoji { font-size: 44px; align-self: center; }
.ci-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ci-body h3 { font-family: var(--display); font-size: 15px; letter-spacing: -.02em; }
.ci-meta { font-size: 13px; color: var(--ink-2); }
.ci-note { font-size: 12px; color: var(--orange-2); font-weight: 600; }
.ci-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; flex-wrap: wrap; }
.ci-foot b { font-family: var(--display); font-size: 15px; }
.ci-ctrl { display: flex; align-items: center; gap: 10px; }
.ci-ctrl .stepper { width: 120px; }
.upsell { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.up-item { border: 1.5px solid var(--line); border-radius: 20px; padding: 12px; display: flex; flex-direction: column; align-items: flex-start; text-align: left; gap: 2px; background: var(--card); transition: border-color .2s, transform .1s; }
.up-item:active { transform: scale(.97); }
.up-item.in { border-color: var(--green); }
.up-emoji { font-size: 30px; }
.up-item b { font-size: 14px; }
.up-item small { font-size: 12px; color: var(--ink-3); }
.up-price { margin-top: 6px; font-weight: 700; font-size: 13px; color: var(--orange-2); }
.up-item.in .up-price { color: var(--green); }
.summary { border-radius: 24px; background: var(--soft); padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.sum-line { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; color: var(--ink-2); }
.sum-line b { color: var(--ink); white-space: nowrap; }
.sum-line.total { font-size: 16px; color: var(--ink); padding-top: 8px; border-top: 1px solid var(--line); margin-bottom: 6px; }
.sum-line.total b { font-family: var(--display); font-size: 18px; }
.free-hint { font-size: 12px; color: var(--green); font-weight: 600; }

/* ---------- Tracking ---------- */
.track-hero { display: flex; gap: 16px; align-items: flex-end; background: var(--beige-2); border-radius: 28px; padding: 16px; }
.th-art { width: 130px; flex: none; display: flex; justify-content: center; }
.th-info { flex: 1; min-width: 0; padding-bottom: 8px; }
.eta { font-family: var(--display); font-size: 28px; font-weight: 800; letter-spacing: -.03em; }
.timeline { list-style: none; padding: 0; margin: 20px 0; display: flex; flex-direction: column; }
.timeline li { display: flex; gap: 12px; align-items: center; position: relative; padding: 8px 0; color: var(--ink-3); font-weight: 600; }
.timeline li:not(:last-child)::after { content: ''; position: absolute; left: 17px; top: 42px; height: 20px; width: 2px; background: var(--line); }
.timeline li.past::after { background: var(--orange); }
.timeline .dot { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--soft); font-family: var(--display); font-size: 13px; flex: none; }
.timeline li.past { color: var(--ink); }
.timeline li.past .dot { background: var(--orange); color: #fff; }
.timeline li.now { color: var(--ink); font-weight: 750; }
.timeline li.now .dot { background: #000; color: var(--orange); animation: pulse 1.4s infinite; }

/* ---------- Kitchen ---------- */
.kitchen { min-height: 100%; background: #0B0B0B; color: #F4F0EA; padding: 16px 16px 28px; }
.k-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
.k-head > div:nth-child(2) { flex: 1; }
.k-head h1 { font-family: var(--display); font-size: clamp(18px, 4.6vw, 26px); letter-spacing: -.03em; }
.k-head p { color: #9C948B; font-size: 13.5px; margin-top: 4px; }
.icon-btn.k { background: #1D1C1B; color: #fff; }
.k-clock { font-family: var(--display); font-size: 22px; color: var(--orange); }
.k-cols { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding-inline: 16px; margin: 0 -16px; padding: 0 16px 10px; }
.k-col { flex: 0 0 min(88vw, 400px); scroll-snap-align: start; display: flex; flex-direction: column; gap: 12px; }
.k-col h2 { font-family: var(--display); font-size: 16px; display: flex; align-items: center; gap: 8px; }
.k-col h2 span { background: #2A2826; border-radius: 999px; padding: 2px 10px; font-size: 13px; }
.k-empty { border: 1.5px dashed #2E2C2A; border-radius: 20px; padding: 26px; text-align: center; color: #6D665F; }
.ticket { background: #171615; border: 1.5px solid #2A2826; border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.ticket.st-new { border-color: var(--orange); }
.ticket.st-ready { border-color: var(--green); }
.ticket header { display: flex; justify-content: space-between; align-items: baseline; }
.ticket header b { font-family: var(--display); font-size: 18px; }
.t-time { font-family: var(--display); color: #9C948B; }
.t-mode { font-size: 12.5px; color: #9C948B; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.live { background: var(--orange); color: #fff; padding: 2px 8px; border-radius: 999px; font-weight: 700; font-size: 11px; }
.t-burger h4 { font-family: var(--display); font-size: 15px; color: var(--orange); margin-bottom: 6px; }
.t-layers { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.t-layers button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 10px; font-size: 15px; font-weight: 600; text-align: left; transition: background .15s, color .15s; }
.t-layers button:hover { background: #211F1D; }
.t-layers button.on { color: #6D665F; text-decoration: line-through; }
.tick { width: 22px; height: 22px; border-radius: 7px; border: 2px solid #4A4642; display: grid; place-items: center; font-size: 13px; color: #fff; flex: none; }
.t-layers button.on .tick { background: var(--green); border-color: var(--green); }
.t-facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 8px 0 0; }
.t-facts div { background: #211F1D; border-radius: 12px; padding: 8px; }
.t-facts dt { font-size: 11px; color: #9C948B; }
.t-facts dd { margin: 0; font-size: 12.5px; font-weight: 700; }
.t-extras, .t-note { font-size: 13px; color: #CFC8C0; }
.t-comment { background: #2E1A0E; color: #FFB27F; border-radius: 12px; padding: 8px 10px; font-size: 13.5px; font-weight: 600; }
.t-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.k-start { background: var(--orange); color: #fff; }
.k-ready { background: var(--green); color: #fff; }

/* ---------- Admin ---------- */
.admin-tabs { margin-bottom: 14px; }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.kpi { border: 1.5px solid var(--line); border-radius: 20px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi span { font-size: 12px; color: var(--ink-3); font-weight: 600; }
.kpi b { font-family: var(--display); font-size: clamp(14px, 1.15vw, 17px); letter-spacing: -.02em; line-height: 1.2; overflow-wrap: anywhere; }
.admin-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 12px; }
.panel { border: 1.5px solid var(--line); border-radius: 22px; padding: 16px; min-width: 0; }
.panel h3 { font-size: 15px; font-weight: 700; margin-bottom: 14px; }
.bars { display: flex; align-items: stretch; gap: 6px; }
.bar-col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; min-width: 0; }
.bar-col i { width: 100%; max-width: 34px; background: var(--orange); border-radius: 8px 8px 3px 3px; transition: height .6s; }
.bar-col:nth-child(odd) i { background: #000; }
:root[data-theme="dark"] .bar-col:nth-child(odd) i { background: #fff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .bar-col:nth-child(odd) i { background: #E8E1D8; } }
.bv { font-size: 10.5px; font-weight: 700; color: var(--ink-2); }
.bl { font-size: 11px; color: var(--ink-3); }
.hbars { display: flex; flex-direction: column; gap: 8px; }
.hbar { display: grid; grid-template-columns: minmax(90px, 40%) 1fr auto; align-items: center; gap: 10px; font-size: 13px; }
.hbar span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hbar i { height: 10px; border-radius: 10px; background: var(--orange); display: block; }
.hbar b { font-size: 12.5px; }
.table-wrap { overflow-x: auto; margin-top: 12px; border: 1.5px solid var(--line); border-radius: 20px; }
table { border-collapse: collapse; width: 100%; min-width: 620px; font-size: 13.5px; }
th, td { padding: 11px 14px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; color: var(--ink-3); font-weight: 650; background: var(--soft); }
tr:last-child td { border-bottom: 0; }
tr.hl td { background: var(--orange-soft); font-weight: 600; }
.switch { width: 46px; height: 28px; border-radius: 999px; background: var(--line); position: relative; transition: background .2s; }
.switch i { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .2s; }
.switch.on { background: var(--green); }
.switch.on i { transform: translateX(18px); }

/* ---------- Sheets, toasts, overlays ---------- */
.overlay { position: fixed; inset: 0; z-index: 200; background: rgba(0, 0, 0, .45); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s ease; backdrop-filter: blur(2px); }
@keyframes fade { from { opacity: 0; } }
.sheet { width: 100%; max-height: 92%; overflow-y: auto; background: var(--bg); border-radius: 28px 28px 0 0; padding: 8px 18px calc(22px + env(safe-area-inset-bottom, 0px)); animation: up .32s cubic-bezier(.25, .9, .3, 1); }
@keyframes up { from { transform: translateY(100%); } }
.sheet-grip { width: 40px; height: 5px; border-radius: 5px; background: var(--line); margin: 4px auto 8px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 10px; }
.sheet-head h3 { font-family: var(--display); font-size: 19px; letter-spacing: -.03em; }
.save-body { display: flex; flex-direction: column; gap: 14px; }
.replace-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.replace-item { border: 1.5px solid var(--line); border-radius: 18px; padding: 8px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; font-size: 12.5px; font-weight: 600; }
.replace-item small { color: var(--ink-3); }
.replace-item.current { border-color: var(--orange); background: var(--orange-soft); }
.replace-item:disabled { opacity: .4; }

.recipe-card { border-radius: 26px; overflow: hidden; border: 1.5px solid var(--line); background: var(--card); }
.rc-art { background: radial-gradient(circle at 50% 80%, var(--beige), var(--beige-2)); display: flex; justify-content: center; padding-top: 14px; }
.rc-body { padding: 16px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.rc-body h3 { font-family: var(--display); font-size: 24px; letter-spacing: -.03em; line-height: 1.1; }
.rc-stats { display: flex; gap: 12px; flex-wrap: wrap; color: var(--ink-2); font-size: 14px; align-items: baseline; }
.rc-stats b { font-family: var(--display); color: var(--orange); font-size: 17px; }
.rc-author { font-size: 13px; color: var(--ink-3); font-weight: 600; }
.saved-result { display: flex; flex-direction: column; gap: 14px; }
.sr-btns { display: flex; flex-direction: column; gap: 8px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.share-card { background: #000; color: #fff; border-radius: 28px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.sc-top { display: flex; justify-content: space-between; align-items: center; }
.sc-brand { font-family: var(--display); font-weight: 700; color: var(--orange); }
.sc-art { background: radial-gradient(circle at 50% 75%, #3A2A1C, #000 70%); border-radius: 22px; display: flex; justify-content: center; padding-top: 10px; }
.sc-h { font-family: var(--display); font-size: 15px; color: #CFC8C0; line-height: 1.2; }
.sc-h b { font-size: 26px; color: #fff; letter-spacing: -.03em; }
.sc-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.sc-stats span { display: flex; flex-direction: column; font-size: 11px; color: #9C948B; }
.sc-stats b { font-family: var(--display); font-size: 13.5px; color: #fff; white-space: nowrap; }
.sc-q { font-family: var(--display); font-size: 20px; color: var(--orange); letter-spacing: -.02em; }
.share-btns { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 12px; }
.sb { height: 50px; border-radius: 16px; font-weight: 700; color: #fff; transition: transform .1s, filter .2s; }
.sb:active { transform: scale(.96); }
.sb:hover { filter: brightness(1.08); }
.sb.ig { background: linear-gradient(45deg, #F58529, #DD2A7B 55%, #8134AF); }
.sb.tg { background: #229ED9; }
.sb.tt { background: #000; box-shadow: inset 0 0 0 1.5px #333; }
.sb.cp { background: var(--soft); color: var(--ink); }
.install p { margin-bottom: 10px; }

.toasts { position: fixed; left: 0; right: 0; bottom: calc(var(--tab-h) + 90px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 300; pointer-events: none; padding: 0 16px; }
.is-desk .toasts { bottom: 28px; }
.toast { background: #000; color: #fff; padding: 12px 18px; border-radius: 16px; font-weight: 600; font-size: 14px; max-width: 440px; text-align: center; animation: toast .3s cubic-bezier(.3, .9, .3, 1.2); box-shadow: 0 10px 30px -10px rgba(0, 0, 0, .5); }
.toast.ok { background: #000; box-shadow: inset 0 0 0 2px var(--orange); }
.toast.err { background: #B3261E; }
.btn:disabled { opacity: .6; pointer-events: none; }
@keyframes toast { from { transform: translateY(16px) scale(.95); opacity: 0; } }

.monster { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); z-index: 250; width: min(92vw, 440px); background: var(--orange); color: #fff; border-radius: 24px; padding: 14px 16px; display: flex; gap: 12px; align-items: center; box-shadow: 0 18px 40px -14px rgba(255, 90, 0, .8); animation: monster .7s cubic-bezier(.3, 1.4, .4, 1); cursor: pointer; }
.monster.party { background: #000; color: #fff; box-shadow: 0 18px 40px -14px rgba(0, 0, 0, .8), inset 0 0 0 2px var(--orange); }
.monster.tall { background: #000; }
.m-fire { font-size: 38px; animation: wobble 1s ease-in-out infinite; }
.m-body { display: flex; flex-direction: column; }
.m-body b { font-family: var(--display); font-size: 17px; letter-spacing: -.02em; }
.m-body span { font-size: 13.5px; opacity: .95; }
@keyframes monster { 0% { transform: translate(-50%, -140%) scale(.8); } 60% { transform: translate(-50%, 8%) rotate(-1.5deg); } 80% { transform: translate(-50%, -2%) rotate(1deg); } 100% { transform: translate(-50%, 0); } }
@keyframes wobble { 50% { transform: rotate(-10deg) scale(1.12); } }

.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 400; overflow: hidden; }
.confetti i { position: absolute; top: -24px; animation: fall linear forwards; }
@keyframes fall { to { transform: translate(var(--drift), 110vh) rotate(var(--rot)); } }

/* ---------- Responsive ---------- */
@media (min-width: 600px) {
  .c-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .ch-grid { grid-template-columns: repeat(2, 1fr); }
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .upsell { grid-template-columns: repeat(4, 1fr); }
  .party-grid { grid-template-columns: repeat(6, 1fr); }
  .party-facts { grid-template-columns: repeat(4, 1fr); }
  .ing-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (min-width: 1024px) {
  body { font-size: 15.5px; }
  .page { padding: 28px 36px 56px; }
  .hero { grid-template-columns: 1.05fr 1fr; gap: 30px; min-height: 480px; }
  .hero-art { order: 0; height: 470px; }
  .hero-disc { width: min(430px, 90%); }
  .benefits { grid-template-columns: repeat(5, 1fr); border-top: 0; margin-top: 40px; }
  .benefit { flex-direction: column; border-bottom: 0; border-left: 1px solid var(--line); padding: 4px 20px; }
  .benefit:first-child { border-left: 0; padding-left: 0; }
  .surprise { flex-direction: row; align-items: center; justify-content: space-between; padding: 30px 36px; }
  .party-teaser { grid-template-columns: 1fr 1.3fr; align-items: center; padding: 30px 36px; }
  .h-scroll { margin: 0; padding: 4px 0 10px; }
  .cart-layout { grid-template-columns: minmax(0, 1fr) 360px; align-items: start; }
  .cart-side { position: sticky; top: 0; }
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .admin-grid { grid-template-columns: 1fr 1fr; }
  .panel.wide { grid-column: 1 / -1; }
  .k-cols { overflow: visible; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); }
  .kitchen { padding: 24px 28px; }
  .overlay { align-items: center; }
  .sheet { width: min(480px, 92vw); border-radius: 28px; padding-bottom: 22px; animation: rise .28s cubic-bezier(.25, .9, .3, 1); }
  .sheet-grip { display: none; }
  .track-hero { padding: 24px; }
  .th-art { width: 180px; }
  .ing-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .s-list { grid-template-columns: repeat(2, 1fr); }
}
@keyframes rise { from { transform: translateY(24px) scale(.97); opacity: 0; } }
@media (min-width: 1500px) {
  .builder.desk { grid-template-columns: 400px minmax(0, 1fr) 380px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

.side-link svg { flex: none; width: 20px; height: 20px; }
.r-builder .sidebar { width: 76px; padding: 20px 10px; align-items: center; }
.r-builder .sidebar .sl-t, .r-builder .side-cap, .r-builder .logo > span { display: none; }
.r-builder .side-link { justify-content: center; padding: 11px; position: relative; }
.r-builder .side-link .count { position: absolute; top: 2px; right: 2px; }
.r-builder .side-logo { padding: 6px; align-self: center; }
.r-builder .side-order { padding: 10px; text-align: center; }

@media (max-width: 380px) {
  .stats-row { padding: 6px 12px 10px; gap: 6px; }
  .stat-v { font-size: 13.5px; }
  .stat.main .stat-v { font-size: 15px; }
  .stat-v small { font-size: 9px; }
  .cb-v { font-size: 16px; }
  .cart-bar { padding: 10px 12px; gap: 8px; }
  .cart-bar .btn { padding: 0 14px; font-size: 14px; }
  .monster { padding: 10px 12px; }
  .monster .m-body b { font-size: 16px; }
}

/* ---------- Заказ: стоп-лист, минимальная сумма, оформление, статус ---------- */
.pending-bar { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 16px; background: var(--orange-soft); color: var(--orange-2); font-size: 13.5px; font-weight: 650; }
.pending-bar.off { background: #B3261E; color: #fff; }
.pending-bar.off .link { color: #fff; text-decoration: underline; }
.cart-item.bad { border-color: #D12D1F; }
.ci-issue { font-size: 12.5px; font-weight: 650; color: #D12D1F; }
.ci-unit { font-weight: 500; color: var(--ink-3); font-size: 12px; }
.min-note { font-size: 13px; color: #B3261E; background: #FDECEA; border-radius: 12px; padding: 8px 10px; }
.up-item.out, .up-item:disabled { opacity: .5; }
.co-section { display: flex; flex-direction: column; gap: 14px; }
.co-section .sec-title { margin: 8px 0 0; }
.select { border: 1.5px solid var(--line); border-radius: 16px; padding: 13px 14px; background: var(--card); font: inherit; font-size: 16px; color: var(--ink); width: 100%; }
.input-row { display: flex; gap: 8px; align-items: center; }
.input-row input { flex: 1; min-width: 0; }
.field em.note { color: var(--ink-3); }
.zone-card { border-radius: 16px; padding: 12px 14px; background: #E3F6EC; color: #0F6B3B; display: flex; flex-direction: column; gap: 2px; font-size: 14px; }
.zone-card.bad { background: #FDECEA; color: #B3261E; }
.zone-list { display: grid; gap: 8px; }
.zone-opt { border: 1.5px solid var(--line); border-radius: 16px; padding: 10px 14px; display: flex; justify-content: space-between; gap: 10px; text-align: left; font-size: 14px; }
.zone-opt span { color: var(--ink-3); white-space: nowrap; }
.zone-opt.on { border-color: var(--orange); background: var(--orange-soft); }
.saved-addr .chip { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.seg button:disabled { opacity: .45; }
.timeline .tl-time { margin-left: auto; font-size: 12.5px; color: var(--ink-3); font-weight: 600; }
.track-hero.cancelled { background: #FDECEA; }
.bar.bad i { background: #B3261E; }
.sum-line b.wrap { white-space: normal; text-align: right; }
.warn.limit { background: #FDECEA; border-color: #F5C6C1; }
.warn.limit b { color: #B3261E; }
:root[data-theme="dark"] .min-note, :root[data-theme="dark"] .zone-card.bad, :root[data-theme="dark"] .track-hero.cancelled, :root[data-theme="dark"] .warn.limit { background: #3A1512; border-color: #5A211C; color: #FF9D93; }
:root[data-theme="dark"] .zone-card { background: #0F2E1E; color: #7EE2A8; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .min-note, :root:not([data-theme="light"]) .zone-card.bad, :root:not([data-theme="light"]) .track-hero.cancelled, :root:not([data-theme="light"]) .warn.limit { background: #3A1512; border-color: #5A211C; color: #FF9D93; }
  :root:not([data-theme="light"]) .zone-card { background: #0F2E1E; color: #7EE2A8; }
}

/* ---------- Иконки: Material Symbols Rounded ---------- */
.ms { font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; font-size: 20px; line-height: 1; letter-spacing: normal; text-transform: none; white-space: nowrap; direction: ltr; display: inline-block; width: 1em; height: 1em; overflow: hidden; flex: none; vertical-align: -.22em; user-select: none; font-feature-settings: 'liga'; -webkit-font-smoothing: antialiased; font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
.ms.fill { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
.ms.rot { transform: rotate(180deg); }
.ms-text { display: inline-block; line-height: 1; }
.tab-ico .ms { font-size: 24px; }
.side-link .ms { font-size: 22px; }
.side-order .ms { font-size: 18px; }
.empty-icon .ms { font-size: 40px; color: var(--orange); }
.b-ico .ms { font-size: 22px; color: var(--orange-2); }
.mc-i .ms { font-size: 28px; color: var(--orange); }
.ch-ico .ms { font-size: 34px; color: var(--orange); }
.badge span .ms { font-size: 28px; }
.ci-emoji .ms { font-size: 40px; color: var(--orange); }
.up-emoji .ms { font-size: 28px; color: var(--orange); }
.m-fire .ms { font-size: 38px; color: var(--orange); }
.cat-ico { display: inline-flex; }
.cat-ico .ms, .chip .ms { font-size: 18px; }
.btn .ms { font-size: 20px; }
.btn.sm .ms { font-size: 18px; }
.stepper .ms { font-size: 20px; vertical-align: middle; }
.icon-btn .ms { font-size: 22px; }
.sec-title { display: flex; align-items: center; gap: 8px; }
.sec-title .ms { color: var(--orange); font-size: 22px; }
.menu-list button > span:first-child { display: inline-flex; align-items: center; gap: 10px; }
.menu-list .ms { color: var(--ink-2); }
.menu-list .danger .ms { color: #D12D1F; }
.type-badge .ms { font-size: 14px; margin-right: 3px; }
.ing-meta .hot .ms { font-size: 13px; color: #E0352B; vertical-align: -.15em; }
.editing .ms { font-size: 14px; }
.warn b .ms, .ci-issue .ms { font-size: 16px; }
.zone-card b { display: flex; align-items: center; gap: 6px; }
.timeline .dot .ms { font-size: 18px; }
.from-bot { margin-left: 8px; color: var(--green); font-weight: 650; display: inline-flex; align-items: center; gap: 3px; font-size: 12px; }
.from-bot .ms { font-size: 15px; }
.pending-bar span { display: inline-flex; align-items: center; gap: 6px; }
.seg button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }

/* ---------- Касса и админ-панель (/staff): стиль Mini App, компактнее ---------- */
.st .btn { height: 40px; padding: 0 16px; font-size: 14px; gap: 6px; }
.st .btn.sm { height: 34px; padding: 0 12px; font-size: 13px; }
.st .btn.primary { box-shadow: 0 8px 18px -12px rgba(255, 90, 0, .9); }
.st .chip { height: 34px; padding: 0 12px; font-size: 13px; }
.st .chip.sm { height: 30px; padding: 0 10px; font-size: 12.5px; gap: 4px; }
.st .icon-btn { width: 36px; height: 36px; }
.st .icon-btn.sm { width: 34px; height: 34px; }
.st .icon-btn.xs { width: 28px; height: 28px; }
.st .icon-btn.xs .ms { font-size: 18px; }
.st .icon-btn.soft { background: var(--soft); }
.st .icon-btn:disabled { opacity: .3; }
.st .switch { width: 38px; height: 22px; flex: none; }
.st .switch i { top: 3px; left: 3px; width: 16px; height: 16px; }
.st .switch.on i { transform: translateX(16px); }
.seg.sm { padding: 3px; gap: 2px; }
.seg.sm button { flex: none; height: 30px; padding: 0 12px; font-size: 13px; gap: 5px; }
.seg.sm button .ms { font-size: 17px; }
.seg.sm em { font-style: normal; font-size: 11.5px; color: var(--ink-3); font-weight: 700; }
.seg.sm button.on em { color: var(--orange-2); }
.seg.xs { padding: 2px; gap: 2px; }
.seg.xs button { flex: none; width: 34px; height: 28px; }
.seg.xs button .ms { font-size: 17px; }

/* каркас */
.st-app { height: 100%; display: flex; flex-direction: column; background: var(--bg); }
.st-bar { flex: none; height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--bg); position: relative; z-index: 30; }
.st-app.alarm .st-bar { box-shadow: inset 0 -2px 0 var(--orange); }
.st-sec { display: inline-flex; align-items: center; gap: 6px; padding-left: 14px; border-left: 1px solid var(--line); font-weight: 650; font-size: 14px; color: var(--ink-2); }
.st-sec .ms { color: var(--orange); }
.st-bar-r { margin-left: auto; display: flex; align-items: center; gap: 12px; position: relative; }
.st-alert { display: inline-flex; align-items: center; gap: 5px; height: 32px; padding: 0 12px; border-radius: 999px; background: var(--orange); color: #fff; font-weight: 700; font-size: 13px; animation: pulse 1.4s ease-in-out infinite; }
.st-alert .ms { font-size: 18px; }
.st-alert { white-space: nowrap; }
.st-net { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 650; color: var(--ink-3); }
.st-net i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px rgba(23, 160, 88, .18); }
.st-net.off { color: #D12D1F; }
.st-net.off i { background: #D12D1F; box-shadow: 0 0 0 3px rgba(209, 45, 31, .18); }
.st-clock { font-family: var(--display); font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
.st-burger { background: var(--soft); }
.st-burger.on { background: var(--ink); color: var(--bg); }
.st-offline { flex: none; display: flex; align-items: center; gap: 8px; background: #B3261E; color: #fff; padding: 8px 16px; font-size: 13px; font-weight: 650; }
.st-main { flex: 1; min-height: 0; overflow: auto; }
.st-page { max-width: 1440px; margin: 0 auto; padding: 20px 20px 48px; }

/* выпадающее меню */
.st-menu-bg { position: fixed; inset: 0; z-index: 40; }
.st-menu { position: absolute; right: 0; top: 46px; z-index: 41; width: 292px; max-height: calc(100vh - 72px); overflow: auto; background: var(--card); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow-2); padding: 8px; animation: menuIn .16s ease-out; }
@keyframes menuIn { from { opacity: 0; transform: translateY(-6px) scale(.98); } }
.st-me { display: flex; gap: 10px; align-items: center; padding: 8px 8px 12px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.st-me > span:last-child { display: flex; flex-direction: column; min-width: 0; }
.st-me b { font-size: 14px; }
.st-me small { font-size: 12px; color: var(--ink-3); }
.st-ava { width: 36px; height: 36px; border-radius: 50%; background: var(--orange-soft); color: var(--orange-2); display: grid; place-items: center; font-family: var(--display); font-weight: 700; flex: none; }
.st-ava.sm { width: 30px; height: 30px; font-size: 13px; }
.st-mgroup { padding: 4px 0; border-bottom: 1px solid var(--line); }
.st-mcap { display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding: 8px 10px 4px; }
.st-mi { width: 100%; display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border-radius: 12px; font-size: 14px; font-weight: 600; color: var(--ink-2); text-align: left; }
.st-mi:hover { background: var(--soft); color: var(--ink); }
.st-mi.on { background: var(--orange-soft); color: var(--orange-2); }
.st-mi span { flex: 1; text-align: left; }
.st-mi em { font-style: normal; font-size: 11.5px; font-weight: 700; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--soft); color: var(--ink-2); display: grid; place-items: center; }
.st-mi em.hot { background: var(--orange); color: #fff; }
.st-mi.danger { color: #D12D1F; margin-top: 4px; }
.st-mi.danger:hover { background: #FDECEA; }
.st-mrow { display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 10px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
.st-mrow span { flex: 1; text-align: left; }

/* заголовок раздела и панели */
.st-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; margin-bottom: 16px; }
.st-head h1 { font-family: var(--display); font-weight: 800; font-size: 24px; letter-spacing: -.03em; line-height: 1.15; }
.st-head p { color: var(--ink-3); font-size: 13.5px; margin-top: 4px; max-width: 72ch; }
.st-head-act { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.st-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.st-stack { display: flex; flex-direction: column; gap: 14px; }
.st-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
.st-under { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-top: 10px; }
.st-under .muted-t { flex: 1 1 300px; }
.st-h4 { font-size: 13px; font-weight: 700; color: var(--ink-2); margin: 16px 0 8px; }
section > .st-h4:first-child { margin-top: 0; }
.pill-bad { background: #FDECEA; color: #B3261E; }
.mt { margin-top: 14px; }

/* поля */
.in { height: 40px; border: 1.5px solid var(--line); border-radius: 12px; padding: 0 12px; background: var(--card); color: var(--ink); font: inherit; font-size: 14px; outline: none; transition: border-color .15s, box-shadow .15s; min-width: 0; width: 100%; }
.in:focus { border-color: var(--orange); box-shadow: 0 0 0 3px var(--orange-soft); }
.in.sm { height: 34px; border-radius: 10px; font-size: 13.5px; padding: 0 10px; }
select.in { width: auto; cursor: pointer; }
.w-xs { width: 64px !important; }
.w-s { width: 84px !important; }
.w-m { width: 112px !important; }
.w-time { width: 120px !important; }
.in-wrap { position: relative; display: flex; align-items: center; }
.in-wrap.grow { flex: 1 1 240px; }
.in-wrap > .ms { position: absolute; left: 11px; color: var(--ink-3); font-size: 19px; pointer-events: none; }
.in-wrap > .ms + .in { padding-left: 38px; }
.in-wrap:has(.in-act) .in { padding-right: 42px; }
.in-act { position: absolute; right: 4px; width: 34px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: var(--ink-3); }
.in-act:hover { background: var(--soft); color: var(--ink); }
.fld { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.fld > span { font-size: 12.5px; font-weight: 650; color: var(--ink-2); }
.fld small { font-size: 11.5px; color: var(--ink-3); }
.fld.wide { grid-column: 1 / -1; }
.fld-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.chk-row { display: flex; flex-wrap: wrap; gap: 10px 22px; margin-top: 14px; }
.chk { display: inline-flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 600; cursor: pointer; }
.color { width: 34px; height: 30px; border: 1.5px solid var(--line); border-radius: 8px; padding: 2px; background: var(--card); cursor: pointer; }
.icon-pick { display: flex; align-items: center; gap: 6px; }
.icon-pick > .ms { color: var(--orange); font-size: 22px; }
.icon-pick select { width: 150px; }

/* карточки */
.card { background: var(--card); border: 1.5px solid var(--line); border-radius: 20px; padding: 16px; min-width: 0; }
.card.flat { background: var(--soft); border-color: transparent; }
.card-t { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; margin-bottom: 12px; }
.card-t .ms { color: var(--orange); }
.card-sub { color: var(--ink-3); font-size: 13px; margin: -6px 0 12px; }
.card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; margin-top: 12px; }
.kv { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 7px 0; font-size: 13.5px; color: var(--ink-2); border-bottom: 1px solid var(--line); }
.kv:last-child { border-bottom: 0; }
.kv > span { display: inline-flex; align-items: center; gap: 7px; min-width: 0; }
.kv > span .ms { font-size: 18px; color: var(--ink-3); }
.kv b { color: var(--ink); text-align: right; font-weight: 650; }
.kv b a { color: var(--orange-2); }
.kv.total { font-size: 15px; }
.kv.total b { font-family: var(--display); font-size: 17px; }
.kv code { font-size: 12px; color: var(--ink-2); overflow-wrap: anywhere; text-align: right; }

/* показатели */
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-bottom: 10px; }
.kpi-c { background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; padding: 12px 14px; display: grid; grid-template-columns: auto 1fr; column-gap: 10px; align-items: center; }
.kpi-c > .ms { grid-row: span 2; width: 38px; height: 38px; line-height: 38px; text-align: center; border-radius: 12px; background: var(--soft); font-size: 20px; color: var(--ink-2); }
.kpi-c span { font-size: 12px; color: var(--ink-3); font-weight: 600; }
.kpi-c b { font-family: var(--display); font-size: 16px; letter-spacing: -.02em; }
.kpi-c.ok > .ms { background: #E3F6EC; color: var(--green); }
.kpi-c.bad > .ms { background: #FDECEA; color: #B3261E; }
.kpi-c.accent > .ms { background: var(--orange-soft); color: var(--orange-2); }

/* таблицы */
.tbl-card { padding: 0; overflow: auto; }
.tbl-card.inner { border: 1.5px solid var(--line); border-radius: 14px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 640px; }
.tbl th { text-align: left; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); padding: 10px 12px; background: var(--soft); border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: normal; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td small { display: block; color: var(--ink-3); font-size: 12px; }
.tbl .r { text-align: right; }
.tbl .nowrap, .tbl .muted { white-space: nowrap; }
.tbl .muted { color: var(--ink-3); }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--beige-2); }
.tbl tr.muted-row td { opacity: .5; }
.tbl td.ellipsis { max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tbl td.wrap-cell { min-width: 260px; }
.tbl td.empty-cell { text-align: center; color: var(--ink-3); padding: 28px; }
.tbl .in.sm:not([class*="w-"]) { min-width: 150px; }
.cell-i { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.cell-i .ms { font-size: 18px; color: var(--ink-3); }
.who { display: flex; align-items: center; gap: 10px; }
.who > span:last-child { display: flex; flex-direction: column; }
.who .pill { font-style: normal; padding: 1px 8px; font-size: 11px; margin-left: 6px; }
.st-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 999px; background: var(--orange-soft); color: var(--orange-2); white-space: nowrap; }
.st-chip .ms { font-size: 15px; }
.st-chip.st-done { background: #E3F6EC; color: var(--green); }
.st-chip.st-cancelled { background: #FDECEA; color: #B3261E; }
.cat-row { margin-bottom: 10px; flex-wrap: wrap; }

/* стоп-лист */
.stop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; align-items: start; }
.stop-row { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.stop-row:last-child { border-bottom: 0; }
.stop-row span { flex: 1; }
.stop-row em { font-style: normal; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #FDECEA; color: #B3261E; }
.stop-row.off span { color: var(--ink-3); text-decoration: line-through; }

/* касса */
.desk-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; align-items: start; }
.desk-col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.desk-col h2 { display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 700; color: var(--ink-2); padding: 0 4px; }
.desk-col h2 .ms { font-size: 19px; color: var(--ink-3); }
.desk-col .cnt { margin-left: auto; min-width: 24px; height: 22px; padding: 0 7px; border-radius: 999px; background: var(--soft); display: grid; place-items: center; font-size: 12px; }
.col-new h2 .ms { color: var(--orange); }
.col-new .cnt { background: var(--orange); color: #fff; }
.desk-empty { border: 1.5px dashed var(--line); border-radius: 18px; padding: 22px; text-align: center; color: var(--ink-3); font-size: 13px; }
.oc { background: var(--card); border: 1.5px solid var(--line); border-radius: 20px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; font-size: 13.5px; transition: border-color .2s, box-shadow .2s; }
.oc.is-new { border-color: var(--orange); box-shadow: 0 0 0 3px var(--orange-soft); }
.oc.fresh { animation: fresh 1s ease-in-out 6; }
@keyframes fresh { 50% { box-shadow: 0 0 0 7px rgba(255, 90, 0, .28); } }
.oc.st-ready { border-color: var(--green); }
.oc-top { display: flex; align-items: center; gap: 6px; min-width: 0; }
.oc-id { font-family: var(--display); font-size: 17px; font-weight: 800; letter-spacing: -.02em; flex: none; }
.chip-mode { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: 999px; background: var(--soft); font-size: 12px; font-weight: 700; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.chip-mode .ms { font-size: 16px; }
.chip-mode.m-delivery { background: var(--orange-soft); color: var(--orange-2); }
.chip-mode.m-hall { background: #ECE8FF; color: #4B32C3; }
.oc-timer { margin-left: auto; display: inline-flex; align-items: center; gap: 3px; height: 24px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--ink-2); background: var(--soft); white-space: nowrap; font-variant-numeric: tabular-nums; flex: none; }
.oc-timer .ms { font-size: 15px; }
.oc-timer.wait { color: var(--orange-2); background: var(--orange-soft); }
.oc-timer.late { color: #fff; background: #D12D1F; }
.oc-timer.ok { color: var(--green); background: #E3F6EC; }
.oc-rows { display: flex; flex-direction: column; gap: 4px; }
.oc-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; color: var(--ink-2); line-height: 1.35; }
.oc-row > .ms { font-size: 17px; color: var(--ink-3); }
.oc-row b { color: var(--ink); }
.oc-row a { color: var(--orange-2); font-weight: 650; }
.oc-row .oc-time { margin-left: auto; }
.oc-row.accent { color: var(--orange-2); }
.oc-row.accent .ms { color: var(--orange); }
.oc-items { list-style: none; margin: 0; padding: 8px 0; border-top: 1px dashed var(--line); border-bottom: 1px dashed var(--line); display: flex; flex-direction: column; gap: 6px; }
.oc-item { display: flex; gap: 6px; align-items: baseline; }
.oc-item .q { color: var(--orange-2); font-weight: 750; min-width: 22px; }
.oc-item .nm { flex: 1; font-weight: 650; color: var(--ink); }
.oc-item b { white-space: nowrap; font-weight: 650; }
.oc-items small { display: block; padding-left: 28px; color: var(--ink-3); font-size: 12px; }
.oc-layers { margin: 4px 0 0 28px; padding-left: 16px; font-size: 12.5px; color: var(--ink-2); }
.oc-more { display: inline-flex; align-items: center; gap: 4px; align-self: flex-start; font-size: 12.5px; font-weight: 650; color: var(--orange-2); }
.oc-more .ms { font-size: 18px; transition: transform .2s; }
.oc-comment { display: flex; gap: 6px; align-items: flex-start; background: #FFF6D6; color: #6B4E00; border-radius: 12px; padding: 7px 10px; font-size: 13px; font-weight: 600; }
.oc-comment .ms { font-size: 16px; margin-top: 1px; }
.oc-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-3); }
.oc-foot span { display: inline-flex; align-items: center; gap: 5px; }
.oc-foot .ms { font-size: 16px; }
.oc-foot b { font-family: var(--display); font-size: 16px; color: var(--ink); letter-spacing: -.02em; white-space: nowrap; }
.oc-cancel { display: flex; gap: 6px; align-items: center; color: #B3261E; font-weight: 650; font-size: 13px; }
.oc-cancel .ms { font-size: 17px; }
.oc-actions { display: flex; gap: 6px; }
.oc-actions .btn:first-child { flex: 1; }
.closed-t { margin: 22px 0 10px; font-size: 13.5px; }
.closed-list { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.closed-row { display: flex; align-items: center; gap: 10px; text-align: left; background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; padding: 10px 12px; font-size: 13px; }
.closed-row > span { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.closed-row small { color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.closed-row em { font-style: normal; font-size: 12px; color: var(--ink-3); max-width: 40%; text-align: right; }
.closed-row .ms.ok { color: var(--green); }
.closed-row .ms.bad { color: #D12D1F; }

/* детали заказа */
.od-status { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 15px; }
.od-status > .ms { color: var(--orange); font-size: 24px; }
.od-grid { display: grid; gap: 12px; }
.od-log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.od-log li { display: grid; grid-template-columns: 104px 1fr; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.od-log li:last-child { border-bottom: 0; }
.od-log time { color: var(--ink-3); font-variant-numeric: tabular-nums; }
.od-log div { display: flex; flex-direction: column; }
.od-log span { color: var(--ink-3); }
.chip.danger { border-color: #F5C6C1; color: #B3261E; }
.chip:disabled { opacity: .4; cursor: default; }
details.links summary { cursor: pointer; font-weight: 650; display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; }
details.links summary .ms { color: var(--orange); }
details.links .muted-t { margin: 8px 0; }
.sheet.st .sheet-head h3 { font-size: 18px; }

/* вход */
.st-login { min-height: 100%; display: grid; place-items: center; padding: 20px; background: var(--beige-2); position: relative; }
.st-theme-btn { position: absolute; top: 14px; right: 14px; background: var(--card); }
.st-login-card { width: min(380px, 100%); background: var(--card); border: 1.5px solid var(--line); border-radius: 28px; padding: 26px 22px; display: flex; flex-direction: column; gap: 16px; box-shadow: var(--shadow-2); }
.st-login-card h1 { font-family: var(--display); font-size: 20px; letter-spacing: -.02em; margin-bottom: 2px; }
.st-err { display: flex; align-items: center; gap: 6px; color: #D12D1F; font-weight: 650; font-size: 13.5px; }
.st-err .ms { font-size: 18px; }
.st-app .toasts, .st-login ~ .toasts { bottom: 22px; }

/* тёмная тема: те же тона, что у Mini App */
:root[data-theme="dark"] .oc-comment { background: #3A2F0C; color: #F2D27A; }
:root[data-theme="dark"] .chip-mode.m-hall { background: #262040; color: #B9AAFF; }
:root[data-theme="dark"] .pill-bad, :root[data-theme="dark"] .stop-row em, :root[data-theme="dark"] .st-chip.st-cancelled, :root[data-theme="dark"] .kpi-c.bad > .ms, :root[data-theme="dark"] .st-mi.danger:hover { background: #3A1512; color: #FF9D93; }
:root[data-theme="dark"] .st-chip.st-done, :root[data-theme="dark"] .kpi-c.ok > .ms, :root[data-theme="dark"] .oc-timer.ok { background: #0F2E1E; color: #7EE2A8; }
:root[data-theme="dark"] .chip.danger { border-color: #5A211C; color: #FF9D93; }

@media (max-width: 720px) {
  .st-sec, .st-net, .hide-s { display: none; }
  .st-head h1 { font-size: 21px; }
  .st-page { padding: 14px 12px 32px; }
  .st-bar { padding: 0 12px; gap: 10px; }
}
@media (min-width: 1024px) {
  .sheet.sheet-wide { width: min(900px, 94vw); max-height: 88vh; }
  .od-grid { grid-template-columns: 1fr 1fr; }
}

/* ---------- Раздел «Админ» внутри Mini App (касса и админ-панель без логина) ---------- */
.st-app.embedded { height: 100%; background: var(--bg); }
.st-app.embedded .st-bar { height: 52px; }
.st-app.embedded .st-sec { padding-left: 0; border-left: 0; display: inline-flex; }
.st-app.embedded .st-page { padding: 14px 12px 24px; }
.st-app.embedded .toasts { bottom: calc(var(--tab-h) + 30px + env(safe-area-inset-bottom, 0px)); }
.st-app.embedded .st-menu { max-height: calc(100vh - 180px); }
.st-gate { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 32px; text-align: center; }
.st-gate > .ms { font-size: 40px; color: var(--orange); }
.st-gate b { font-family: var(--display); font-size: 18px; }
.ci-note .link { font-size: 12px; }
:root[data-theme="dark"] .tabbar { box-shadow: 0 14px 34px -12px rgba(0, 0, 0, .8); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tabbar { box-shadow: 0 14px 34px -12px rgba(0, 0, 0, .8); } }
</style>
</head>
