/* каркас */
.st-app { height: 100%; display: flex; flex-direction: column; background: var(--bg); }
.st-bar { flex: none; height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--bg); position: relative; z-index: 30; }
.st-app.alarm .st-bar { box-shadow: inset 0 -2px 0 var(--orange); }
.st-sec { display: inline-flex; align-items: center; gap: 6px; padding-left: 14px; border-left: 1px solid var(--line); font-weight: 650; font-size: 14px; color: var(--ink-2); }
.st-sec .ms { color: var(--orange); }
.st-bar-r { margin-left: auto; display: flex; align-items: center; gap: 12px; position: relative; }
.st-alert { display: inline-flex; align-items: center; gap: 5px; height: 32px; padding: 0 12px; border-radius: 999px; background: var(--orange); color: #fff; font-weight: 700; font-size: 13px; animation: pulse 1.4s ease-in-out infinite; }
.st-alert .ms { font-size: 18px; }
.st-alert { white-space: nowrap; }
.st-net { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 650; color: var(--ink-3); }
.st-net i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px rgba(23, 160, 88, .18); }
.st-net.off { color: #D12D1F; }
.st-net.off i { background: #D12D1F; box-shadow: 0 0 0 3px rgba(209, 45, 31, .18); }
.st-clock { font-family: var(--display); font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
.st-burger { background: var(--soft); }
.st-burger.on { background: var(--ink); color: var(--bg); }
.st-offline { flex: none; display: flex; align-items: center; gap: 8px; background: #B3261E; color: #fff; padding: 8px 16px; font-size: 13px; font-weight: 650; }
.st-main { flex: 1; min-height: 0; overflow: auto; }
.st-page { max-width: 1440px; margin: 0 auto; padding: 20px 20px 48px; }

/* выпадающее меню */
.st-menu-bg { position: fixed; inset: 0; z-index: 40; }
.st-menu { position: absolute; right: 0; top: 46px; z-index: 41; width: 292px; max-height: calc(100vh - 72px); overflow: auto; background: var(--card); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow-2); padding: 8px; animation: menuIn .16s ease-out; }
@keyframes menuIn { from { opacity: 0; transform: translateY(-6px) scale(.98); } }
.st-me { display: flex; gap: 10px; align-items: center; padding: 8px 8px 12px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.st-me > span:last-child { display: flex; flex-direction: column; min-width: 0; }
.st-me b { font-size: 14px; }
.st-me small { font-size: 12px; color: var(--ink-3); }
.st-ava { width: 36px; height: 36px; border-radius: 50%; background: var(--orange-soft); color: var(--orange-2); display: grid; place-items: center; font-family: var(--display); font-weight: 700; flex: none; }
.st-ava.sm { width: 30px; height: 30px; font-size: 13px; }
.st-mgroup { padding: 4px 0; border-bottom: 1px solid var(--line); }
.st-mcap { display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding: 8px 10px 4px; }
.st-mi { width: 100%; display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border-radius: 12px; font-size: 14px; font-weight: 600; color: var(--ink-2); text-align: left; }
.st-mi:hover { background: var(--soft); color: var(--ink); }
.st-mi.on { background: var(--orange-soft); color: var(--orange-2); }
.st-mi span { flex: 1; text-align: left; }
.st-mi em { font-style: normal; font-size: 11.5px; font-weight: 700; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--soft); color: var(--ink-2); display: grid; place-items: center; }
.st-mi em.hot { background: var(--orange); color: #fff; }
.st-mi.danger { color: #D12D1F; margin-top: 4px; }
.st-mi.danger:hover { background: #FDECEA; }
.st-mrow { display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 10px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
.st-mrow span { flex: 1; text-align: left; }

/* заголовок раздела и панели */
.st-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; margin-bottom: 16px; }
.st-head h1 { font-family: var(--display); font-weight: 800; font-size: 24px; letter-spacing: -.03em; line-height: 1.15; }
.st-head p { color: var(--ink-3); font-size: 13.5px; margin-top: 4px; max-width: 72ch; }
.st-head-act { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.st-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.st-stack { display: flex; flex-direction: column; gap: 14px; }
.st-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
.st-under { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-top: 10px; }
.st-under .muted-t { flex: 1 1 300px; }
.st-h4 { font-size: 13px; font-weight: 700; color: var(--ink-2); margin: 16px 0 8px; }
section > .st-h4:first-child { margin-top: 0; }
.pill-bad { background: #FDECEA; color: #B3261E; }
.mt { margin-top: 14px; }

/* поля */
.in { height: 40px; border: 1.5px solid var(--line); border-radius: 12px; padding: 0 12px; background: var(--card); color: var(--ink); font: inherit; font-size: 14px; outline: none; transition: border-color .15s, box-shadow .15s; min-width: 0; width: 100%; }
.in:focus { border-color: var(--orange); box-shadow: 0 0 0 3px var(--orange-soft); }
.in.sm { height: 34px; border-radius: 10px; font-size: 13.5px; padding: 0 10px; }
select.in { width: auto; cursor: pointer; }
.w-xs { width: 64px !important; }
.w-s { width: 84px !important; }
.w-m { width: 112px !important; }
.w-time { width: 120px !important; }
.in-wrap { position: relative; display: flex; align-items: center; }
.in-wrap.grow { flex: 1 1 240px; }
.in-wrap > .ms { position: absolute; left: 11px; color: var(--ink-3); font-size: 19px; pointer-events: none; }
.in-wrap > .ms + .in { padding-left: 38px; }
.in-wrap:has(.in-act) .in { padding-right: 42px; }
.in-act { position: absolute; right: 4px; width: 34px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: var(--ink-3); }
.in-act:hover { background: var(--soft); color: var(--ink); }
.fld { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.fld > span { font-size: 12.5px; font-weight: 650; color: var(--ink-2); }
.fld small { font-size: 11.5px; color: var(--ink-3); }
.fld.wide { grid-column: 1 / -1; }
.fld-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.chk-row { display: flex; flex-wrap: wrap; gap: 10px 22px; margin-top: 14px; }
.chk { display: inline-flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 600; cursor: pointer; }
.color { width: 34px; height: 30px; border: 1.5px solid var(--line); border-radius: 8px; padding: 2px; background: var(--card); cursor: pointer; }
.icon-pick { display: flex; align-items: center; gap: 6px; }
.icon-pick > .ms { color: var(--orange); font-size: 22px; }
.icon-pick select { width: 150px; }

/* карточки */
.card { background: var(--card); border: 1.5px solid var(--line); border-radius: 20px; padding: 16px; min-width: 0; }
.card.flat { background: var(--soft); border-color: transparent; }
.card-t { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; margin-bottom: 12px; }
.card-t .ms { color: var(--orange); }
.card-sub { color: var(--ink-3); font-size: 13px; margin: -6px 0 12px; }
.card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; margin-top: 12px; }
.kv { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 7px 0; font-size: 13.5px; color: var(--ink-2); border-bottom: 1px solid var(--line); }
.kv:last-child { border-bottom: 0; }
.kv > span { display: inline-flex; align-items: center; gap: 7px; min-width: 0; }
.kv > span .ms { font-size: 18px; color: var(--ink-3); }
.kv b { color: var(--ink); text-align: right; font-weight: 650; }
.kv b a { color: var(--orange-2); }
.kv.total { font-size: 15px; }
.kv.total b { font-family: var(--display); font-size: 17px; }
.kv code { font-size: 12px; color: var(--ink-2); overflow-wrap: anywhere; text-align: right; }

/* показатели */
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-bottom: 10px; }
.kpi-c { background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; padding: 12px 14px; display: grid; grid-template-columns: auto 1fr; column-gap: 10px; align-items: center; }
.kpi-c > .ms { grid-row: span 2; width: 38px; height: 38px; line-height: 38px; text-align: center; border-radius: 12px; background: var(--soft); font-size: 20px; color: var(--ink-2); }
.kpi-c span { font-size: 12px; color: var(--ink-3); font-weight: 600; }
.kpi-c b { font-family: var(--display); font-size: 16px; letter-spacing: -.02em; }
.kpi-c.ok > .ms { background: #E3F6EC; color: var(--green); }
.kpi-c.bad > .ms { background: #FDECEA; color: #B3261E; }
.kpi-c.accent > .ms { background: var(--orange-soft); color: var(--orange-2); }

/* таблицы */
.tbl-card { padding: 0; overflow: auto; }
.tbl-card.inner { border: 1.5px solid var(--line); border-radius: 14px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 640px; }
.tbl th { text-align: left; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); padding: 10px 12px; background: var(--soft); border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: normal; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td small { display: block; color: var(--ink-3); font-size: 12px; }
.tbl .r { text-align: right; }
.tbl .nowrap, .tbl .muted { white-space: nowrap; }
.tbl .muted { color: var(--ink-3); }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--beige-2); }
.tbl tr.muted-row td { opacity: .5; }
.tbl td.ellipsis { max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tbl td.wrap-cell { min-width: 260px; }
.tbl td.empty-cell { text-align: center; color: var(--ink-3); padding: 28px; }
.tbl .in.sm:not([class*="w-"]) { min-width: 150px; }
.cell-i { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.cell-i .ms { font-size: 18px; color: var(--ink-3); }
.who { display: flex; align-items: center; gap: 10px; }
.who > span:last-child { display: flex; flex-direction: column; }
.who .pill { font-style: normal; padding: 1px 8px; font-size: 11px; margin-left: 6px; }
.st-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 999px; background: var(--orange-soft); color: var(--orange-2); white-space: nowrap; }
.st-chip .ms { font-size: 15px; }
.st-chip.st-done { background: #E3F6EC; color: var(--green); }
.st-chip.st-cancelled { background: #FDECEA; color: #B3261E; }
.cat-row { margin-bottom: 10px; flex-wrap: wrap; }

/* стоп-лист */
.stop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; align-items: start; }
.stop-row { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.stop-row:last-child { border-bottom: 0; }
.stop-row span { flex: 1; }
.stop-row em { font-style: normal; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #FDECEA; color: #B3261E; }
.stop-row.off span { color: var(--ink-3); text-decoration: line-through; }

/* касса */
.desk-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; align-items: start; }
.desk-col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.desk-col h2 { display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 700; color: var(--ink-2); padding: 0 4px; }
.desk-col h2 .ms { font-size: 19px; color: var(--ink-3); }
.desk-col .cnt { margin-left: auto; min-width: 24px; height: 22px; padding: 0 7px; border-radius: 999px; background: var(--soft); display: grid; place-items: center; font-size: 12px; }
.col-new h2 .ms { color: var(--orange); }
.col-new .cnt { background: var(--orange); color: #fff; }
.desk-empty { border: 1.5px dashed var(--line); border-radius: 18px; padding: 22px; text-align: center; color: var(--ink-3); font-size: 13px; }
.oc { background: var(--card); border: 1.5px solid var(--line); border-radius: 20px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; font-size: 13.5px; transition: border-color .2s, box-shadow .2s; }
.oc.is-new { border-color: var(--orange); box-shadow: 0 0 0 3px var(--orange-soft); }
.oc.fresh { animation: fresh 1s ease-in-out 6; }
@keyframes fresh { 50% { box-shadow: 0 0 0 7px rgba(255, 90, 0, .28); } }
.oc.st-ready { border-color: var(--green); }
.oc-top { display: flex; align-items: center; gap: 6px; min-width: 0; }
.oc-id { font-family: var(--display); font-size: 17px; font-weight: 800; letter-spacing: -.02em; flex: none; }
.chip-mode { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: 999px; background: var(--soft); font-size: 12px; font-weight: 700; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.chip-mode .ms { font-size: 16px; }
.chip-mode.m-delivery { background: var(--orange-soft); color: var(--orange-2); }
.chip-mode.m-hall { background: #ECE8FF; color: #4B32C3; }
.oc-timer { margin-left: auto; display: inline-flex; align-items: center; gap: 3px; height: 24px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--ink-2); background: var(--soft); white-space: nowrap; font-variant-numeric: tabular-nums; flex: none; }
.oc-timer .ms { font-size: 15px; }
.oc-timer.wait { color: var(--orange-2); background: var(--orange-soft); }
.oc-timer.late { color: #fff; background: #D12D1F; }
.oc-timer.ok { color: var(--green); background: #E3F6EC; }
.oc-rows { display: flex; flex-direction: column; gap: 4px; }
.oc-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; color: var(--ink-2); line-height: 1.35; }
.oc-row > .ms { font-size: 17px; color: var(--ink-3); }
.oc-row b { color: var(--ink); }
.oc-row a { color: var(--orange-2); font-weight: 650; }
.oc-row .oc-time { margin-left: auto; }
.oc-row.accent { color: var(--orange-2); }
.oc-row.accent .ms { color: var(--orange); }
.oc-items { list-style: none; margin: 0; padding: 8px 0; border-top: 1px dashed var(--line); border-bottom: 1px dashed var(--line); display: flex; flex-direction: column; gap: 6px; }
.oc-item { display: flex; gap: 6px; align-items: baseline; }
.oc-item .q { color: var(--orange-2); font-weight: 750; min-width: 22px; }
.oc-item .nm { flex: 1; font-weight: 650; color: var(--ink); }
.oc-item b { white-space: nowrap; font-weight: 650; }
.oc-items small { display: block; padding-left: 28px; color: var(--ink-3); font-size: 12px; }
.oc-layers { margin: 4px 0 0 28px; padding-left: 16px; font-size: 12.5px; color: var(--ink-2); }
.oc-more { display: inline-flex; align-items: center; gap: 4px; align-self: flex-start; font-size: 12.5px; font-weight: 650; color: var(--orange-2); }
.oc-more .ms { font-size: 18px; transition: transform .2s; }
.oc-comment { display: flex; gap: 6px; align-items: flex-start; background: #FFF6D6; color: #6B4E00; border-radius: 12px; padding: 7px 10px; font-size: 13px; font-weight: 600; }
.oc-comment .ms { font-size: 16px; margin-top: 1px; }
.oc-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-3); }
.oc-foot span { display: inline-flex; align-items: center; gap: 5px; }
.oc-foot .ms { font-size: 16px; }
.oc-foot b { font-family: var(--display); font-size: 16px; color: var(--ink); letter-spacing: -.02em; white-space: nowrap; }
.oc-cancel { display: flex; gap: 6px; align-items: center; color: #B3261E; font-weight: 650; font-size: 13px; }
.oc-cancel .ms { font-size: 17px; }
.oc-actions { display: flex; gap: 6px; }
.oc-actions .btn:first-child { flex: 1; }
.closed-t { margin: 22px 0 10px; font-size: 13.5px; }
.closed-list { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.closed-row { display: flex; align-items: center; gap: 10px; text-align: left; background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; padding: 10px 12px; font-size: 13px; }
.closed-row > span { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.closed-row small { color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.closed-row em { font-style: normal; font-size: 12px; color: var(--ink-3); max-width: 40%; text-align: right; }
.closed-row .ms.ok { color: var(--green); }
.closed-row .ms.bad { color: #D12D1F; }

/* детали заказа */
.od-status { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 15px; }
.od-status > .ms { color: var(--orange); font-size: 24px; }
.od-grid { display: grid; gap: 12px; }
.od-log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.od-log li { display: grid; grid-template-columns: 104px 1fr; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.od-log li:last-child { border-bottom: 0; }
.od-log time { color: var(--ink-3); font-variant-numeric: tabular-nums; }
.od-log div { display: flex; flex-direction: column; }
.od-log span { color: var(--ink-3); }
.chip.danger { border-color: #F5C6C1; color: #B3261E; }
.chip:disabled { opacity: .4; cursor: default; }
details.links summary { cursor: pointer; font-weight: 650; display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; }
details.links summary .ms { color: var(--orange); }
details.links .muted-t { margin: 8px 0; }
.sheet.st .sheet-head h3 { font-size: 18px; }

/* вход */
.st-login { min-height: 100%; display: grid; place-items: center; padding: 20px; background: var(--beige-2); position: relative; }
.st-theme-btn { position: absolute; top: 14px; right: 14px; background: var(--card); }
.st-login-card { width: min(380px, 100%); background: var(--card); border: 1.5px solid var(--line); border-radius: 28px; padding: 26px 22px; display: flex; flex-direction: column; gap: 16px; box-shadow: var(--shadow-2); }
.st-login-card h1 { font-family: var(--display); font-size: 20px; letter-spacing: -.02em; margin-bottom: 2px; }
.st-err { display: flex; align-items: center; gap: 6px; color: #D12D1F; font-weight: 650; font-size: 13.5px; }
.st-err .ms { font-size: 18px; }
.st-app .toasts, .st-login ~ .toasts { bottom: 22px; }

/* тёмная тема: те же тона, что у Mini App */
:root[data-theme="dark"] .oc-comment { background: #3A2F0C; color: #F2D27A; }
:root[data-theme="dark"] .chip-mode.m-hall { background: #262040; color: #B9AAFF; }
:root[data-theme="dark"] .pill-bad, :root[data-theme="dark"] .stop-row em, :root[data-theme="dark"] .st-chip.st-cancelled, :root[data-theme="dark"] .kpi-c.bad > .ms, :root[data-theme="dark"] .st-mi.danger:hover { background: #3A1512; color: #FF9D93; }
:root[data-theme="dark"] .st-chip.st-done, :root[data-theme="dark"] .kpi-c.ok > .ms, :root[data-theme="dark"] .oc-timer.ok { background: #0F2E1E; color: #7EE2A8; }
:root[data-theme="dark"] .chip.danger { border-color: #5A211C; color: #FF9D93; }

@media (max-width: 720px) {
  .st-sec, .st-net, .hide-s { display: none; }
  .st-head h1 { font-size: 21px; }
  .st-page { padding: 14px 12px 32px; }
  .st-bar { padding: 0 12px; gap: 10px; }
}
@media (min-width: 1024px) {
  .sheet.sheet-wide { width: min(900px, 94vw); max-height: 88vh; }
  .od-grid { grid-template-columns: 1fr 1fr; }
}

/* ---------- Раздел «Админ» внутри Mini App (касса и админ-панель без логина) ---------- */
.st-app.embedded { height: 100%; background: var(--bg); }
.st-app.embedded .st-bar { height: 52px; }
.st-app.embedded .st-sec { padding-left: 0; border-left: 0; display: inline-flex; }
.st-app.embedded .st-page { padding: 14px 12px 24px; }
.st-app.embedded .toasts { bottom: calc(var(--tab-h) + 30px + env(safe-area-inset-bottom, 0px)); }
.st-app.embedded .st-menu { max-height: calc(100vh - 180px); }
.st-gate { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 32px; text-align: center; }
.st-gate > .ms { font-size: 40px; color: var(--orange); }
.st-gate b { font-family: var(--display); font-size: 18px; }
.ci-note .link { font-size: 12px; }
:root[data-theme="dark"] .tabbar { box-shadow: 0 14px 34px -12px rgba(0, 0, 0, .8); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tabbar { box-shadow: 0 14px 34px -12px rgba(0, 0, 0, .8); } }

/* переключатель темы в профиле; смена темы — плавная */
.theme-seg button { font-size: 13px; padding: 0 6px; gap: 5px; }
.theme-seg .ms { font-size: 18px; }
html.theme-anim, html.theme-anim * { transition: background-color .3s ease, border-color .3s ease, color .3s ease !important; }

/* сотрудники из Telegram */
.tg-add { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tg-add .in-wrap.grow { flex: 1 1 220px; }
.tg-hint { margin-top: 10px; font-size: 12.5px; }
.tg-list { padding: 4px 14px; }
.tg-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.tg-row:last-child { border-bottom: 0; }
.tg-row.off { opacity: .55; }
.tg-who { flex: 1 1 160px; min-width: 0; display: flex; flex-direction: column; }
.tg-who b { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font-size: 14px; }
.tg-who .pill { font-style: normal; padding: 1px 8px; font-size: 11px; }
.tg-who small { font-size: 12px; color: var(--ink-3); overflow-wrap: anywhere; }
.tg-ctl { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.tg-ctl select.in { width: auto; }

/* ---------- Карта: точка доставки и ресторан, зоны доставки ---------- */
.map-box { position: relative; border-radius: 18px; overflow: hidden; border: 1.5px solid var(--line); background: var(--soft); isolation: isolate; }
.map-canvas { position: absolute; inset: 0; }
.map-state { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-3); font-size: 13px; font-weight: 600; text-align: center; padding: 16px; }
.map-fit { position: absolute; right: 10px; bottom: 22px; z-index: 500; height: 32px; padding: 0 12px; border-radius: 999px; background: #fff; color: #16120E; font-size: 12.5px; font-weight: 700; box-shadow: 0 4px 14px -6px rgba(0, 0, 0, .4); }
.map-pin { display: block; width: 30px; height: 30px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--orange); border: 3px solid #fff; box-shadow: 0 6px 14px -4px rgba(0, 0, 0, .5); }
.map-pin::after { content: ''; position: absolute; inset: 7px; border-radius: 50%; background: #fff; }
.map-pin.shop { background: #16120E; }
.map-sheet { display: flex; flex-direction: column; gap: 10px; }
.map-sheet .hint { margin: 0; }
.leaflet-container { font: inherit; background: var(--soft); }
.zone-card.idle { background: var(--soft); color: var(--ink-2); }
.zone-card.idle b .ms { color: var(--orange); }
.zone-rows { display: flex; flex-direction: column; gap: 6px; }
.zone-head, .zone-row { display: grid; grid-template-columns: 52px 64px minmax(0, 1fr) 64px 28px; gap: 6px; align-items: center; }
.zone-head { font-size: 11.5px; font-weight: 700; color: var(--ink-3); padding: 0 2px; }
.zone-head span:first-child { grid-column: span 2; }
.zone-head span:nth-child(2) { display: none; }
.zone-row .in { width: 100%; }
.zone-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; flex: none; }
.zone-from { display: inline-flex; align-items: center; justify-content: flex-end; font-weight: 700; font-size: 13.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ===================== Меню, оплата, котлетки, кухня, промокоды ===================== */
.center { text-align: center; }

/* Главная: бургеры сменяются по кругу (дуга вокруг точки под сценой) */
.home .hero { gap: 4px; }
.hero-art.hc { height: 360px; overflow: hidden; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.hc-slot { position: absolute; left: 0; right: 0; bottom: 34px; display: flex; justify-content: center; transform-origin: 50% 190%; will-change: transform, opacity; }
.hc-slot.enter { animation: hcEnter .75s cubic-bezier(.2, .85, .25, 1) both; }
.hc-slot.leave { animation: hcLeave .7s cubic-bezier(.55, 0, .75, .4) both; }
@keyframes hcEnter { from { transform: rotate(48deg) scale(.72); opacity: 0; } 60% { opacity: 1; } }
@keyframes hcLeave { to { transform: rotate(-48deg) scale(.72); opacity: 0; } }
.hc .hero-tag { left: 10px; bottom: 44px; animation: fade .4s ease .25s both; }
.hc-dots { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; justify-content: center; gap: 6px; }
.hc-dots i { width: 6px; height: 6px; border-radius: 6px; background: var(--line); transition: width .35s var(--ease-out), background .35s; }
.hc-dots i.on { width: 20px; background: var(--orange); }
.home .hero-text { text-align: center; }
.home .hero h1 { font-size: clamp(26px, 7vw, 54px); }
.home .hero-cta { justify-content: center; }
.block-head h2 { display: flex; align-items: center; gap: 6px; }
.block-head h2 .ms { color: var(--orange); }
.ref-banner { margin-top: 26px; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 22px; background: var(--ink); color: var(--bg); cursor: pointer; }
.ref-banner > div { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ref-banner b { font-size: 15px; }
.ref-banner span { font-size: 12.5px; opacity: .75; }
.rb-ico { width: 44px; height: 44px; border-radius: 14px; background: var(--orange); color: #fff; display: grid; place-items: center; flex: none; }
.rb-ico .ms { font-size: 24px; }

/* Меню */
.menu-chips { margin: 0 -16px 4px; padding: 2px 16px; }
.p-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
.p-card { background: var(--card); border: 1.5px solid var(--line); border-radius: 22px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.p-card.compact { width: 168px; }
.p-card.out { opacity: .55; }
.p-art { position: relative; height: 128px; background: var(--beige-2); display: flex; align-items: flex-end; justify-content: center; padding-top: 8px; overflow: hidden; }
.p-card.compact .p-art { height: 118px; }
.p-art .stack-wrap { pointer-events: none; }
.p-art > svg { align-self: center; }
.prod-ico { align-self: center; margin-bottom: 12px; border-radius: 50%; background: var(--card); display: grid; place-items: center; color: var(--orange); box-shadow: var(--shadow); }
.p-hit { position: absolute; top: 8px; left: 8px; display: inline-flex; align-items: center; gap: 2px; height: 22px; padding: 0 8px 0 5px; border-radius: 999px; background: var(--orange); color: #fff; font-size: 11px; font-weight: 750; }
.p-hit .ms { font-size: 14px; }
.p-spicy { position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; border-radius: 50%; background: var(--card); display: grid; place-items: center; font-size: 14px; box-shadow: var(--shadow); }
.p-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 3px; flex: 1; }
.p-body h3 { font-size: 14.5px; font-weight: 750; line-height: 1.2; }
.p-note { font-size: 12.5px; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.p-meta { font-size: 11.5px; color: var(--ink-3); font-weight: 600; }
.p-foot { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: auto; padding-top: 6px; }
.p-foot > b { font-family: var(--display); font-size: 14px; white-space: nowrap; }
.p-foot .stepper { width: 100px; height: 36px; grid-template-columns: 32px 1fr 32px; }
.p-foot .stepper button { width: 32px; height: 32px; }
.p-add { height: 36px !important; min-width: 36px; padding: 0 10px !important; }
.p-out { font-size: 12px; font-weight: 700; color: var(--ink-3); }
.ps { display: flex; flex-direction: column; gap: 14px; }
.ps-art { height: 200px; border-radius: 22px; background: var(--beige-2); display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
.ps-art > svg, .ps-art > .prod-ico { align-self: center; }
.ps-note { color: var(--ink-2); }
.ps-facts { display: flex; gap: 8px; }
.ps-facts span { flex: 1; background: var(--soft); border-radius: 14px; padding: 8px 10px; display: flex; flex-direction: column; font-size: 11.5px; color: var(--ink-3); font-weight: 600; }
.ps-facts b { font-family: var(--display); font-size: 14px; color: var(--ink); }
.ps-buy { display: flex; gap: 10px; align-items: center; }
.ps-buy .stepper { width: 124px; flex: none; height: 52px; grid-template-columns: 44px 1fr 44px; }
.ps-buy .stepper button { width: 44px; height: 44px; }
.ps-buy .btn { flex: 1; padding: 0 12px; }

/* Корзина: острота и «добавить к заказу» */
.ci-spicy { display: inline-flex; gap: 4px; background: var(--soft); border-radius: 999px; padding: 3px; align-self: flex-start; margin-top: 2px; }
.ci-spicy button { height: 28px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--ink-3); transition: background .2s, color .2s; }
.ci-spicy button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 6px -3px rgba(0, 0, 0, .3); }
.ci-spicy button.on.hot { background: #E0352B; color: #fff; }
.upsell-wrap .sec-title { margin-top: 18px; }
.upsell-row { margin: 0 -16px; padding: 2px 16px 8px; gap: 8px; }
.upsell-row .up-item { width: 132px; flex: none; }
.up-art { height: 56px; display: flex; align-items: center; justify-content: center; align-self: stretch; margin-bottom: 4px; }
.up-art .prod-ico { margin: 0; box-shadow: none; background: var(--orange-soft); }
.up-item small { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.form .upsell-row { margin: 0; padding: 2px 0 8px; }

/* Оплата */
.pay-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.pay-opt { border: 1.5px solid var(--line); border-radius: 18px; padding: 12px; min-height: 74px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 6px; background: var(--card); text-align: left; transition: border-color .2s, box-shadow .2s, transform .1s; }
.pay-opt:active { transform: scale(.97); }
.pay-opt small { font-size: 11.5px; color: var(--ink-3); font-weight: 600; }
.pay-opt .ms { font-size: 24px; color: var(--ink-2); }
.pay-opt.on { border-color: var(--orange); box-shadow: 0 0 0 3px var(--orange-soft); }
.pay-logo { font-family: var(--body); font-weight: 800; font-size: 21px; letter-spacing: -.03em; line-height: 1; display: inline-flex; align-items: center; gap: 5px; }
.pay-logo.click { color: #00A3FF; }
.pay-logo.click i { width: 18px; height: 18px; border-radius: 50%; background: #00A3FF; box-shadow: inset 0 0 0 5px #fff, 0 0 0 1.5px #00A3FF; }
.pay-logo.payme { color: #1B2B3C; }
.pay-logo.payme b { color: #33CCCC; font-weight: 800; }
:root[data-theme="dark"] .pay-logo.payme { color: #fff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pay-logo.payme { color: #fff; } }
.ok-note { color: var(--green) !important; font-style: normal; display: inline-flex; align-items: center; gap: 4px; font-size: 13px; }
.ok-note .ms { font-size: 16px; }
.sum-line.minus b { color: var(--green); }
.cut-toggle { position: relative; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px; background: var(--orange-soft); cursor: pointer; }
.cut-toggle.disabled { opacity: .6; cursor: default; }
.cut-toggle input { position: absolute; opacity: 0; pointer-events: none; }
.cut-t { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.cut-t small { color: var(--ink-2); font-size: 12.5px; }
.ct-ico { width: 40px; height: 40px; border-radius: 12px; background: var(--card); display: grid; place-items: center; font-size: 22px; flex: none; }
.cut-toggle .switch { flex: none; display: block; }
.pay-banner { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 16px; margin-bottom: 14px; border-radius: 20px; text-align: left; color: #fff; background: #00A3FF; box-shadow: 0 12px 26px -14px rgba(0, 120, 200, .8); }
.pay-banner.payme { background: #1B2B3C; }
.pay-banner > span { flex: 1; display: flex; flex-direction: column; }
.pay-banner small { opacity: .8; font-size: 12.5px; }
.pay-banner .pay-logo { background: #fff; border-radius: 10px; padding: 6px 8px; font-size: 16px; }
.pay-banner .pay-logo.payme { color: #1B2B3C; }
.pay-sheet { display: flex; flex-direction: column; gap: 14px; }
.pay-head { display: flex; align-items: center; justify-content: space-between; }
.pay-head .pay-logo { font-size: 28px; }
.pay-test { font-size: 11px; font-weight: 750; text-transform: uppercase; letter-spacing: .06em; color: var(--orange-2); background: var(--orange-soft); padding: 4px 9px; border-radius: 999px; }
.pay-amount { border-radius: 22px; padding: 18px; background: var(--soft); display: flex; flex-direction: column; align-items: center; gap: 2px; }
.pay-amount small { color: var(--ink-3); font-weight: 650; }
.pay-amount b { font-family: var(--display); font-size: 30px; letter-spacing: -.03em; }
.pay-amount span { font-size: 13px; color: var(--ink-2); }
.pay-btn { color: #fff; }
.pay-btn.click { background: #00A3FF; }
.pay-btn.payme { background: #33CCCC; color: #0D2530; }
.pay-done { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; }
.pay-check { width: 64px; height: 64px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; animation: pop .45s ease; }
.pay-check .ms { font-size: 38px; }
.pay-done small { color: var(--ink-3); }

/* Котлетки */
.cutlets { margin-top: 16px; border-radius: 24px; padding: 16px; background: linear-gradient(135deg, var(--orange) 0%, #FF8A3D 100%); color: #fff; display: flex; flex-direction: column; gap: 10px; }
.ct-top { display: flex; align-items: center; gap: 12px; }
.ct-top > div { display: flex; flex-direction: column; }
.cutlets .ct-ico { background: rgba(255, 255, 255, .22); width: 52px; height: 52px; font-size: 28px; border-radius: 16px; }
.ct-l { font-size: 12.5px; font-weight: 700; opacity: .9; }
.ct-v { font-family: var(--display); font-size: 30px; line-height: 1.05; }
.ct-sum { font-size: 12.5px; opacity: .9; }
.ct-hint { font-size: 12.5px; opacity: .92; }
.ct-ref { background: rgba(0, 0, 0, .14); border-radius: 16px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
.ct-ref small { opacity: .85; }
.cutlets .btn.primary { background: #fff; color: var(--orange-2); box-shadow: none; }
.cutlets .btn.outline { border-color: rgba(255, 255, 255, .7); color: #fff; }
.ct-log { background: rgba(0, 0, 0, .12); border-radius: 14px; padding: 8px 12px; font-size: 13px; }
.ct-log summary { cursor: pointer; font-weight: 700; }
.ct-log .kv { color: #fff; border-color: rgba(255, 255, 255, .2); }
.ct-log .kv b { color: #fff; }

/* ---------- Касса: кухня, повар, промокоды ---------- */
.app.staff-only { display: block; height: 100%; }
.app.staff-only .st-app.embedded .toasts { bottom: 22px; }
.login-seg { align-self: stretch; }
.login-seg button { flex: 1 !important; }
.code-in { font-family: var(--display); font-size: 26px !important; letter-spacing: .4em; text-align: center; height: 56px !important; }
.pay-chip { display: inline-flex; align-items: center; gap: 4px; font-weight: 650; }
.pay-chip .ms { font-size: 16px; }
.pay-chip.ok { color: var(--green); }
.pay-chip.wait { color: var(--orange-2); }
.hot-tag { font-style: normal; margin-left: 6px; font-size: 11px; font-weight: 800; color: #fff; background: #E0352B; border-radius: 999px; padding: 1px 7px; white-space: nowrap; }
.hot-tag.big { font-size: 13px; padding: 2px 9px; }
.mild-tag { font-style: normal; margin-left: 6px; font-size: 12px; font-weight: 650; color: var(--ink-3); }
.kitchen-cols { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.kt { background: var(--card); border: 2px solid var(--line); border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.kt.st-accepted { border-color: var(--orange); }
.kt.late { border-color: #D12D1F; box-shadow: 0 0 0 3px rgba(209, 45, 31, .15); }
.kt header { display: flex; align-items: center; gap: 8px; }
.kt header b { font-family: var(--display); font-size: 22px; }
.kt header .oc-timer { margin-left: auto; }
.kt-item h4 { font-size: 17px; font-weight: 800; display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
.kt-item .q { color: var(--orange-2); margin-right: 4px; }
.kt-layers { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.kt-layers button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 12px; font-size: 16px; font-weight: 650; text-align: left; background: var(--soft); }
.kt-layers button.on { text-decoration: line-through; color: var(--ink-3); background: transparent; }
.kt-layers .tick { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--ink-3); color: var(--ink-2); display: grid; place-items: center; font-size: 12px; font-weight: 800; flex: none; }
.kt-layers button.on .tick { background: var(--green); border-color: var(--green); color: #fff; }
.kt-note { display: inline-flex; align-items: center; gap: 4px; color: var(--orange-2); font-weight: 700; margin-top: 4px; }
.kt-act .btn { height: 52px !important; font-size: 16px !important; }
.kt-ready { background: var(--green); color: #fff; }
.cnt-mini { font-style: normal; font-size: 11px; font-weight: 750; color: var(--ink-3); margin-left: 2px; }
.chip.active .cnt-mini { color: var(--bg); opacity: .7; }
.pe-list { display: flex; flex-direction: column; gap: 8px; }
.pe-row { background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; overflow: hidden; }
.pe-row.open { border-color: var(--orange); }
.pe-row.off .pe-head { opacity: .55; }
.pe-head { display: flex; align-items: center; gap: 12px; padding: 8px 12px 8px 8px; cursor: pointer; }
.pe-head > .ms { transition: transform .2s; color: var(--ink-3); }
.pe-art { width: 64px; height: 56px; border-radius: 12px; background: var(--beige-2); display: flex; align-items: flex-end; justify-content: center; overflow: hidden; flex: none; }
.pe-art > svg, .pe-art > .prod-ico { align-self: center; margin: 0; }
.pe-t { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.pe-t b { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 6px; font-size: 14px; }
.pe-t .pill { font-style: normal; padding: 1px 8px; font-size: 11px; }
.pe-t .pill.hit { background: var(--orange); color: #fff; }
.pe-t small { color: var(--ink-3); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pe-body { padding: 4px 14px 14px; border-top: 1px solid var(--line); }
.pe-body .fld-grid { margin-top: 12px; }
.pe-keys { display: flex; gap: 6px; align-items: flex-start; margin-top: 10px; font-size: 12.5px; }
.danger-t { color: #D12D1F !important; }
.promo-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.promo-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; padding: 10px 12px; }
.promo-row.off { opacity: .55; }
.promo-code { font-family: var(--display); font-weight: 800; font-size: 15px; letter-spacing: .04em; padding: 6px 10px; border-radius: 10px; background: var(--orange-soft); color: var(--orange-2); border: 1.5px dashed var(--orange); }
.promo-t { flex: 1 1 200px; min-width: 0; display: flex; flex-direction: column; }
.promo-t b { font-size: 13.5px; }
.promo-t small { color: var(--ink-3); font-size: 12px; }
.promo-act { display: flex; align-items: center; gap: 4px; margin-left: auto; }
.code-up { text-transform: uppercase; font-family: var(--display); letter-spacing: .05em; }
.promo-form { margin-bottom: 4px; }
.cook-code { display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; padding: 24px 16px; }
.cc-digits { display: flex; gap: 8px; }
.cc-digits span { width: 46px; height: 62px; border-radius: 14px; background: var(--soft); display: grid; place-items: center; font-family: var(--display); font-size: 32px; font-weight: 800; }
.cc-ring { --p: 100%; width: 78px; height: 78px; border-radius: 50%; display: grid; place-items: center; align-content: center; background: radial-gradient(closest-side, var(--card) 79%, transparent 80% 100%), conic-gradient(var(--orange) var(--p), var(--line) 0); }
.cc-ring b { font-family: var(--display); font-size: 22px; line-height: 1; }
.cc-ring small { font-size: 11px; color: var(--ink-3); }
.cook-code code { font-size: 12.5px; overflow-wrap: anywhere; }
@media (max-width: 380px) {
  .cc-digits span { width: 38px; height: 54px; font-size: 26px; }
  .p-card.compact { width: 152px; }
}
@media (min-width: 600px) {
  .p-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .pay-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@media (min-width: 1024px) {
  .home .hero { grid-template-columns: 1fr 1fr; }
  .home .hero-text { text-align: left; order: -1; }
  .home .hero-cta { justify-content: flex-start; }
  .hero-art.hc { height: 440px; }
}

/* Ленты с прокруткой не должны раздвигать колонку шире экрана */
.cart-layout { grid-template-columns: minmax(0, 1fr); }
.cart-main, .form, .cart-side { min-width: 0; }
.pay-banner .pay-logo { flex: none; }
.hero-art.hc { height: 300px; }
.hc-slot { bottom: 30px; }
@media (min-width: 1024px) { .cart-layout { grid-template-columns: minmax(0, 1fr) 360px; } }

/* ---------- Фото позиций меню ---------- */
.prod-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.p-art, .ps-art, .ci-art, .up-art, .pe-art, .th-art { position: relative; overflow: hidden; }
.p-art:has(.prod-img) { padding-top: 0; }
.ps-art:has(.prod-img) { height: 230px; }
.th-art:has(.prod-img) { align-self: stretch; min-height: 120px; border-radius: 18px; }
/* «Добавить к заказу»: фото во всю ширину карточки */
.upsell-row .up-item { width: 140px; padding: 0 0 10px; overflow: hidden; gap: 2px; }
.upsell-row .up-item > b, .upsell-row .up-item > small, .upsell-row .up-item > .up-price { padding: 0 10px; }
.upsell-row .up-art { height: 92px; margin: 0 0 6px; align-self: stretch; background: var(--beige-2); }
.upsell-row .up-art .prod-ico { width: 46px !important; height: 46px !important; }
.upsell-row .up-item.in { border-color: var(--green); }
/* админка: поле фото */
.photo-fld { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.photo-prev { width: 120px; height: 90px; border-radius: 14px; background: var(--soft); display: grid; place-items: center; overflow: hidden; flex: none; color: var(--ink-3); }
.photo-prev img { width: 100%; height: 100%; object-fit: cover; }
.photo-prev .ms { font-size: 30px; }
.photo-act { flex: 1 1 180px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.photo-act small { flex-basis: 100%; }
.photo-act label.btn { cursor: pointer; }
.photo-act label.disabled { opacity: .6; pointer-events: none; }
.cc-lead { margin-bottom: 12px; }

/* Касса / Кухня — переключатель вверху раздела «Заказы» */
.pane-switch { max-width: 420px; margin-bottom: 16px; }
.pane-switch button { gap: 6px; }
.pane-n { font-style: normal; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--ink-3); color: #fff; font-size: 11.5px; font-weight: 800; display: inline-grid; place-items: center; }
.pane-n.hot { background: var(--orange); }

/* Фото в списке меню: нажал на миниатюру — выбрал фото */
.pe-photo { cursor: pointer; }
.pe-cam { position: absolute; right: 3px; bottom: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0, 0, 0, .3); }
.pe-cam .ms { font-size: 14px; }
.pe-photo.busy { opacity: .6; }
.pe-tip { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 12.5px; }
.pe-tip .ms { font-size: 16px; color: var(--orange); }
.pe-body > .st-h4:first-child { margin-top: 12px; }
.photo-prev { cursor: pointer; }
.photo-prev.busy { opacity: .6; pointer-events: none; }
.photo-empty { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700; color: var(--ink-3); }
.photo-empty .ms { font-size: 28px; color: var(--orange); }
</style>
